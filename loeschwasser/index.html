<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9DC31A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Löschwasser">
<meta name="description" content="Löschwasserberechnung: Löschwasserbedarf, Förderstrecke, Strahlrohrverbrauch, Löschwasservorrat und Hydrantenverzeichnis.">
<title>Löschwasserberechnung</title>
<style>
:root{
  --ing:#9dc31a;--ing-dark:#5f7600;--ink:#111820;--muted:#667085;--bg:#eef1f4;
  --white:rgba(255,255,255,.86);--eval:rgba(225,228,232,.82);
  --red:#d92d20;--yellow:#b77900;--green:#5f7600;--blue:#1f6feb;
  --radius:20px;--shadow:0 16px 48px rgba(16,24,40,.09);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);min-height:100vh;
  background:radial-gradient(circle at 7% 0,rgba(157,195,26,.13),transparent 28%),linear-gradient(180deg,#f9fbfc,#eef1f4)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h2{font-size:26px;margin:0 0 4px}
h3{font-size:17px;margin:0 0 10px}
p{margin:0 0 10px}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 13px;background:rgba(18,23,27,.94);backdrop-filter:blur(26px);color:#fff;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brandmark{width:42px;height:42px;border-radius:14px;background:var(--ing);color:#131a00;display:grid;place-items:center;font-size:21px;font-weight:900}
.brand strong{font-size:19px;display:block;line-height:1.1}
.brand small{display:block;color:var(--ing);letter-spacing:.16em;font-size:10px;margin-top:2px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#d5dbe0;padding:11px 12px;border-radius:13px;text-align:left}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.09);color:#fff}
.nav button.active{box-shadow:inset 4px 0 0 var(--ing)}
.nav button b{width:20px;text-align:center;font-size:15px}
.nav span{flex:1;font-size:14px}
.sidefoot{position:absolute;left:13px;right:13px;bottom:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:16px;padding:12px;font-size:12px;color:#aab3bb}
.sidefoot b{color:var(--ing);display:block;margin-bottom:3px}
.sidefoot a{color:#d5dbe0}

.main{min-width:0}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;padding:15px 24px;
  background:rgba(249,251,252,.8);backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.85)}
.top h1{font-size:21px;margin:0;flex:1}
.content{max-width:1280px;margin:auto;padding:24px}
.page{display:none}
.page.active{display:block}

.card{background:var(--white);backdrop-filter:blur(20px) saturate(160%);border:1px solid #fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card.eval{background:var(--eval)}
.grid{display:grid;gap:16px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:12px;color:var(--muted);font-weight:600}
label input,label select,label textarea{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid #dfe3e8;border-radius:12px;background:#fff;font-size:15px}
label input:focus,label select:focus,label textarea:focus{outline:2px solid var(--ing);outline-offset:1px;border-color:var(--ing)}
.hint{font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}

.eyebrow{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ing-dark);font-weight:800;margin-bottom:6px}
.section-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.section-head p{color:var(--muted);margin:0}
.section-head .toolbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

button.primary{background:var(--ing);color:#131a00;border:0;padding:11px 17px;border-radius:13px;font-weight:800}
button.secondary{background:#fff;color:var(--ink);border:1px solid #dfe3e8;padding:10px 15px;border-radius:13px;font-weight:600}
button.danger{background:#fff;color:var(--red);border:1px solid #f2c9c5;padding:8px 12px;border-radius:11px;font-weight:600}
button.link{background:none;border:0;color:var(--ing-dark);font-weight:700;padding:0;text-decoration:underline}

.result{display:grid;gap:10px}
.res-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.res-main strong{font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.res-main span{color:var(--muted);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid #e7ebee;border-radius:14px;padding:12px}
.kpi small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;overflow-wrap:anywhere}
.kpi strong{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #e4e8eb;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}

.note{border-left:4px solid var(--ing);background:rgba(157,195,26,.1);border-radius:0 12px 12px 0;padding:11px 13px;font-size:13px;margin:12px 0}
.note.warn{border-left-color:var(--yellow);background:rgba(183,121,0,.1)}
.note.err{border-left-color:var(--red);background:rgba(217,45,32,.09)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#e7ebee;color:#3d474e}
.pill.ok{background:rgba(95,118,0,.15);color:var(--green)}
.pill.warnp{background:rgba(183,121,0,.16);color:var(--yellow)}
.pill.bad{background:rgba(217,45,32,.13);color:var(--red)}

.rowlist{display:grid;gap:8px;margin-top:10px}
.rowitem{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e7ebee;border-radius:13px;padding:10px 12px}
.rowitem .grow{flex:1;min-width:0}
.rowitem b{display:block;font-size:14px}
.rowitem small{color:var(--muted);font-size:12px}
.qty{width:74px;text-align:center;padding:8px;border:1px solid #dfe3e8;border-radius:10px}
.empty{color:var(--muted);font-size:14px;padding:14px;text-align:center;border:1px dashed #d5dbe0;border-radius:14px}

.mono{font-variant-numeric:tabular-nums}
.stack{display:grid;gap:16px}
details{background:#fff;border:1px solid #e7ebee;border-radius:14px;padding:12px 14px;margin-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px}
details table{margin-top:10px}

@media(max-width:1000px){
  .two,.three,.form-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
  .app{display:block}
  .side{position:fixed;left:0;right:0;top:auto;bottom:0;height:66px;padding:6px;z-index:30}
  .brand,.sidefoot{display:none}
  .nav{display:flex;overflow-x:auto;gap:2px}
  .nav button{min-width:62px;flex-direction:column;gap:2px;justify-content:center;padding:8px 6px}
  .nav button.active{box-shadow:inset 0 -4px 0 var(--ing)}
  .nav span{font-size:10px;flex:none;white-space:nowrap}
  .top{padding:12px 15px}
  .top h1{font-size:18px}
  .content{padding:14px 14px 86px}
  .section-head .toolbar{margin-left:0;width:100%}
  .section-head .toolbar button{flex:1}
  h2{font-size:22px}
  .res-main strong{font-size:32px}
}
@media print{
  .side,.top .toolbar,.section-head .toolbar,button{display:none!important}
  .app{display:block}
  .card{box-shadow:none;border:1px solid #ccc;background:#fff;break-inside:avoid}
  body{background:#fff}
}
</style>

<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brandmark">≈</div>
      <div><strong>Löschwasser</strong><small>BERECHNUNG</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <b>Offline nutzbar</b>
      Alle Daten bleiben im Browser (localStorage). Keine Übertragung an Server.
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="pageTitle">Übersicht</h1>
      <div class="toolbar"><button class="secondary" onclick="window.print()">Drucken</button></div>
    </header>
    <div class="content" id="pages"></div>
  </main>
</div>

<script>
/* ============================================================
   Löschwasserberechnung – eigenständige Single-File-Web-App
   Rechenkerne: Löschwasserbedarf, Förderstrecke, Strahlrohr-
   verbrauch, Löschwasservorrat, Hydrantenverzeichnis.
   ============================================================ */

/* ---------- Formatierung ---------- */
const nf = (v, d = 0) => (isFinite(v) ? v : 0).toLocaleString('de-AT', { minimumFractionDigits: d, maximumFractionDigits: d });
const num = id => { const el = document.getElementById(id); const v = parseFloat((el ? el.value : '').toString().replace(',', '.')); return isFinite(v) ? v : 0; };
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const set = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Persistenz ---------- */
const STORE = 'loeschwasserApp';
const defaults = {
  objekte: [],
  quellen: [
    { name: 'Hydrantennetz Ortsleitung', q: 800, t: 120, d: 80 },
    { name: 'Löschwasserbehälter Bauhof', q: 800, t: 120, d: 220 }
  ],
  hydranten: [
    { name: 'Überflurhydrant Hauptplatz', typ: 'Überflurhydrant', leistung: 800, druck: 4.5, lat: null, lon: null, notiz: 'Ringleitung DN 150' },
    { name: 'Unterflurhydrant Schulweg 4', typ: 'Unterflurhydrant', leistung: 400, druck: 3.8, lat: null, lon: null, notiz: 'Standrohr erforderlich' },
    { name: 'Löschteich Ortsrand', typ: 'Saugstelle', leistung: 1600, druck: 0, lat: null, lon: null, notiz: 'Nutzvolumen ca. 250 m³' }
  ],
  rohre: { c9: 2, hsr: 0 },
  bedarfTabelle: null
};
function load() {
  try { return Object.assign(structuredClone(defaults), JSON.parse(localStorage.getItem(STORE) || '{}')); }
  catch (e) { return structuredClone(defaults); }
}
let state = load();
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { } }

/* ============================================================
   1) RECHENKERN – Druckverluste und Förderstrecke
   ============================================================ */

/* Reibungsverlust je 100 m Schlauchleitung [bar].
   B-75 nach österreichischer Ausbildungstabelle
   (200/0,10 · 400/0,25 · 600/0,50 · 800/1,00 · 1000/1,50 · 1200/2,50 · 1600/5,00).
   A-110, C-52, C-42 und D-25 als gebräuchliche Ausbildungswerte. */
const HOSE = {
  B75:  { label: 'B-75 (Ø 75 mm)',            len: 20, dn: 75,  parallel: 1, qMax: 1600, tab: [[0, 0], [200, .10], [400, .25], [600, .50], [800, 1.00], [1000, 1.50], [1200, 2.50], [1600, 5.00]] },
  B75d: { label: 'Doppel-B-75 (2 Leitungen)', len: 20, dn: 75,  parallel: 2, qMax: 3200, tab: null },
  A110: { label: 'A-110 (Ø 110 mm)',          len: 20, dn: 110, parallel: 1, qMax: 3200, tab: [[0, 0], [800, .15], [1200, .35], [1600, .75], [2000, 1.15], [2400, 1.65], [3200, 2.90]] },
  C52:  { label: 'C-52 (Ø 52 mm)',            len: 15, dn: 52,  parallel: 1, qMax: 400,  tab: [[0, 0], [100, .20], [200, .70], [300, 1.50], [400, 2.60]] },
  C42:  { label: 'C-42 (Ø 42 mm)',            len: 15, dn: 42,  parallel: 1, qMax: 300,  tab: [[0, 0], [100, .60], [200, 2.20], [300, 4.80]] },
  D25:  { label: 'D-25 (Ø 25 mm)',            len: 15, dn: 25,  parallel: 1, qMax: 150,  tab: [[0, 0], [50, 1.20], [100, 4.50]] }
};

/* Tabellenwert linear interpolieren, oberhalb des letzten Stützpunktes
   quadratisch extrapolieren (Reibungsverlust ~ Q²). */
function lossPer100(key, q) {
  const spec = HOSE[key];
  if (spec.parallel > 1) return lossPer100('B75', q / spec.parallel);
  const t = spec.tab;
  if (q <= 0) return 0;
  for (let i = 1; i < t.length; i++) {
    if (q <= t[i][0]) {
      const [q0, p0] = t[i - 1], [q1, p1] = t[i];
      return p0 + (p1 - p0) * (q - q0) / (q1 - q0);
    }
  }
  const [qm, pm] = t[t.length - 1];
  return pm * Math.pow(q / qm, 2);
}

/* Wasserinhalt einer Leitung [Liter] */
function hoseVolume(key, length) {
  const spec = HOSE[key];
  const d = spec.dn / 1000;
  return Math.PI / 4 * d * d * length * 1000 * spec.parallel;
}

const BAR_PER_M = 0.1; // 1 bar je 10 m Höhenunterschied

/* Förderstrecken-Berechnung.
   Schritt 1: Druckverlust je Schlauch aus Reibung und Höhe.
   Schritt 2: maximale Schlauchzahl je Abschnitt – für Zwischenabschnitte bis
              zum Mindesteingangsdruck der nächsten Pumpe, für den letzten
              Abschnitt bis zum Solldruck am Leitungsende.
   Schritt 3: kleinste erforderliche Pumpenzahl daraus ableiten.
   Schritt 4: Schläuche möglichst gleichmäßig auf die Abschnitte aufteilen,
              damit die Pumpen ausgewogen stehen und nicht dicht am Ende. */
function foerderstrecke(o) {
  const { q, length, dh, hose, pOut, pInMin, pEnd } = o;
  const spec = HOSE[hose];
  const res = { warn: [], err: null };
  if (q <= 0) { res.err = 'Bitte eine Fördermenge größer 0 eingeben.'; return res; }
  if (length <= 0) { res.err = 'Bitte eine Leitungslänge größer 0 eingeben.'; return res; }
  if (pOut <= pInMin) { res.err = 'Der Pumpenausgangsdruck muss über dem Mindesteingangsdruck liegen.'; return res; }
  if (pOut <= pEnd) { res.err = 'Der Pumpenausgangsdruck muss über dem Solldruck am Leitungsende liegen.'; return res; }

  const nHose = Math.ceil(length / spec.len);   // Schläuche je Leitungsstrang
  const segLen = length / nHose;                // rechnerische Länge je Schlauch
  const lp100 = lossPer100(hose, q);
  const lossHose = lp100 * segLen / 100 + BAR_PER_M * (dh / nHose);

  let sections = [];
  if (lossHose <= 0) {
    /* Gefälle überwiegt: die Leitung baut von selbst Druck auf. */
    sections = [{ hoses: nHose }];
    res.warn.push('Das Gefälle überwiegt den Reibungsverlust. Es ist keine Verstärkerpumpe erforderlich; auf Überdruck am Leitungsende achten und Druckbegrenzung vorsehen.');
  } else {
    const maxInt = Math.floor((pOut - pInMin) / lossHose + 1e-9);
    const maxEnd = Math.floor((pOut - pEnd) / lossHose + 1e-9);
    if (maxEnd < 1) {
      res.err = 'Mit diesen Werten ist keine Förderung möglich: bereits ein einzelner Schlauch verbraucht mehr Druck, als zwischen Pumpenausgang und Solldruck am Leitungsende zur Verfügung steht. Fördermenge verringern oder größeren Schlauchquerschnitt wählen.';
      return res;
    }
    const nPumps = nHose <= maxEnd ? 1 : 1 + Math.ceil((nHose - maxEnd) / maxInt);

    /* gleichmäßig aufteilen, letzter Abschnitt darf maxEnd nicht überschreiten */
    const hEnd = Math.min(maxEnd, Math.ceil(nHose / nPumps));
    let rest = nHose - hEnd;
    for (let i = 0; i < nPumps - 1; i++) {
      const left = nPumps - 1 - i;
      const take = Math.min(maxInt, Math.ceil(rest / left));
      sections.push({ hoses: take });
      rest -= take;
    }
    sections.push({ hoses: hEnd + Math.max(rest, 0) });
  }

  /* Abschnitte auswerten */
  let pos = 0;
  sections.forEach((s, i) => {
    s.nr = i + 1;
    s.from = pos;
    s.len = s.hoses * segLen;
    pos += s.len;
    s.to = pos;
    s.pStart = pOut;
    s.pEnd = pOut - s.hoses * lossHose;
    s.art = i === 0 ? 'Entnahmestelle' : 'Verstärkerpumpe';
  });

  const volume = hoseVolume(hose, length);
  res.sections = sections;
  res.pumps = sections.map(s => ({ nr: s.nr, pos: s.from, art: s.art, pIn: s.nr === 1 ? null : sections[s.nr - 2].pEnd }));
  res.nHose = nHose * spec.parallel;
  res.hoseLen = spec.len;
  res.segLen = segLen;
  res.lossHose = lossHose;
  res.lp100 = lp100;
  res.fricTotal = lp100 * length / 100;
  res.hTotal = BAR_PER_M * dh;
  res.pressureDemand = res.fricTotal + res.hTotal + pEnd;
  res.pEndReal = sections[sections.length - 1].pEnd;
  res.minP = Math.min(...sections.map(s => s.pEnd));
  res.volume = volume;
  res.fillMin = volume / q;
  res.reserve = Math.ceil(res.nHose * 0.1);
  res.maxSpan = Math.max(...sections.map(s => s.len));

  if (dh < 0 && lossHose > 0) res.warn.push('Gefällestrecke: Der Druckgewinn ist berücksichtigt. Bei stark abfallender Leitung auf Überdruck und Druckbegrenzung achten.');
  if (sections.length > 6) res.warn.push('Mehr als sechs Pumpen: Führung als eigener Einsatzabschnitt „Wasserförderung" mit klarer Funkregelung einplanen.');
  if (q >= 1200 && hose === 'B75') res.warn.push('Bei dieser Fördermenge ist eine einzelne B-Leitung sehr verlustreich. Doppel-B-Leitung oder A-Leitung prüfen.');
  if (q > spec.qMax) res.warn.push('Die Fördermenge von ' + nf(q) + ' l/min liegt über dem sinnvollen Bereich von ' + esc(spec.label) + ' (bis rund ' + nf(spec.qMax) + ' l/min). Der Reibungsverlust wird rechnerisch extrapoliert und ist nur als Größenordnung zu werten.');
  return res;
}

/* ============================================================
   2) RECHENKERN – Löschwasserbedarf nach TRVB 137 F
      Ausgabe 01.09.2021, genehmigt am 08.06.2021 (ÖBFV) bzw.
      28.06.2021 (Österreichische Brandverhütungsstellen).
      Alle Tabellen sind wortgetreu übernommen.
   ============================================================ */

/* Tabelle 1: Löschwasserbedarf für den Grundschutz (Richtwerte).
   staffel = erforderliche Löschwasserrate je Entfernungsstaffel
   [bis 125 m, weitere bis 250 m, weitere bis 500 m] in l/min. */
const T1_GRUNDSCHUTZ = [
  { nr: 1, text: 'Gebäude der Gebäudeklasse GK1 und GK2 nach lit. a und b; Garagen und überdachte Stellplätze bis 250 m²', q: 800, t: 1.0, v: 48, staffel: [800, 0, 0] },
  { nr: 2, text: 'Gebäude der Gebäudeklasse GK2 nach lit. c; Gebäude der Gebäudeklasse GK3 bis GK4 mit überwiegender Wohnnutzung; Garagen und überdachte Stellplätze von mehr als 250 m²', q: 1200, t: 1.5, v: 108, staffel: [800, 400, 0] },
  { nr: 3, text: 'Gebäude der Gebäudeklasse GK3 und GK4; Gebäude der Gebäudeklasse GK5 mit überwiegender Wohnnutzung; Parkdecks', q: 1600, t: 2.0, v: 192, staffel: [800, 800, 0] },
  { nr: 4, text: 'Gebäude der Gebäudeklasse GK5; Gebäude mit Fluchtniveau über 22 m', q: 2400, t: 2.0, v: 288, staffel: [800, 800, 800] },
  { nr: 5, text: 'Betriebs- und Gewerbegebiete', q: 3200, t: 2.0, v: 384, staffel: [800, 1200, 1200] },
  { nr: 6, text: 'Industriegebiete', q: 3200, t: 3.0, v: 576, staffel: [800, 1200, 1200] }
];

/* Tabelle 2: Löschwasserbedarf für spezielle Nutzungen innerhalb des bebauten Gebietes */
const T2_SPEZIAL_INNEN = [
  { text: 'Historisch wertvolle Gebäude und Ensembles sowie Klöster, Stifte, Burgen und Schlösser', q: 3200, t: 3.0 },
  { text: 'Parkdecks mit einer Brandabschnittsfläche von über 1.600 m² bis 4.800 m²', q: 3200, t: 2.0 },
  { text: 'Parkdecks mit einer Brandabschnittsfläche von über 4.800 m²', q: 5200, t: 2.0 }
];

/* Tabelle 3: Löschwasserbedarf für spezielle Nutzungen außerhalb des bebauten Gebietes */
const T3_SPEZIAL_AUSSEN = [
  { text: 'Autobahn- und Schnellstraßenparkplätze für KFZ bis 3,5 t höchstzulässige Gesamtmasse', q: 800, t: 1.0 },
  { text: 'Autobahn- und Schnellstraßenparkplätze für KFZ über 3,5 t höchstzulässige Gesamtmasse', q: 1600, t: 1.5 },
  { text: 'Tankstelle', q: 1200, t: 1.0 },
  { text: 'Autobahn- und Schnellstraßenraststationen', q: 1200, t: 1.5 },

/* Rechnerische Brandfläche AB gemäß Punkt 6.1.3 / Tabelle 7 */
function brandflaeche(baf, massnahme) {
  const m = T7_BRANDFLAECHE.find(x => x.id === massnahme) || T7_BRANDFLAECHE[0];
  return { ab: Math.min(baf, m.limit), reduziert: baf > m.limit, limit: m.limit, text: m.text };
}

/* Löschwasserrate für den Objektschutz gemäß Punkt 6.1.4 bzw. 6.1.5 */
function objektschutz(o) {
  const qWand = o.qWand, qDecke = o.qDecke, qm = o.qm;
  const qLwi = qWand + qDecke;
  const qGes = qLwi + qm;
  const ab = o.ab;
  const hinweise = [];

  const qAllgemein = qGes * ab;                       // 6.1.4
  let q = qAllgemein, formel = '6.1.4';
  let qLager = null, gedeckelt = false;

  if (o.lager && o.hL > 2.5 && ab > 0) {              // 6.1.5
    qLager = qGes * (ab + 4 * (o.hL - 2.5) * Math.sqrt(ab));
    formel = '6.1.5';
    if (o.gesprinklert && qLager > 2 * qAllgemein) {
      q = 2 * qAllgemein;
      gedeckelt = true;
      hinweise.push('Lager gesprinklert: Das Ergebnis nach Punkt 6.1.5 ist nur bis zur Verdoppelung des Ergebnisses nach Punkt 6.1.4 zu berücksichtigen. Angesetzt wird daher QLWO = 2 × QLWO-Allgemein.');
    } else {
      q = qLager;
    }
  } else if (o.lager && o.hL > 0 && o.hL <= 2.5) {
    hinweise.push('Bei einer Lagerguthöhe bis 2,5 m ist die allgemeine Berechnungsformel nach Punkt 6.1.4 anzuwenden.');
  }

  const ueber8000 = q > OS_MAX_RATE;
  if (ueber8000) hinweise.push('Die Löschwasserrate übersteigt 8.000 l/min. Gemäß Punkt 6 ist durch entsprechende Brandschutzvorkehrungen eine Reduktion unter 8.000 l/min zu bewirken.');

  return {
    qLwi, qGes, qAllgemein, qLager, q, gedeckelt, formel, ueber8000, hinweise,
    v: q * OS_LIEFERDAUER / 1000,          // Punkt 6.2 [m³]
    vRueckhalt: q * OS_LIEFERDAUER / 1000 * RUECKHALT_FAKTOR   // Punkt 8 [m³]
  };
}

/* Anhang C, Punkt 1.1 und 1.2: Gegenüberstellung der vorhandenen
   Löschwasserversorgung mit dem Grundschutz nach Tabelle 1.
   Überschüsse einer Entfernungsstaffel werden in die nächste übertragen. */
const BAENDER = [{ key: 125, label: 'bis 125 m' }, { key: 250, label: 'bis 250 m (und über 125 m)' }, { key: 500, label: 'bis 500 m (und über 250 m)' }];

function staffelSummen(quellen) {
  const s = [0, 0, 0];
  let ausserhalb = 0;
  quellen.forEach(x => {
    const q = parseFloat(x.q) || 0, d = parseFloat(x.d) || 0;
    if (d <= 125) s[0] += q; else if (d <= 250) s[1] += q; else if (d <= 500) s[2] += q; else ausserhalb += q;
  });
  return { s, ausserhalb };
}

function beurteilungGrundschutz(quellen, zeile) {
  const { s, ausserhalb } = staffelSummen(quellen);
  const rows = [];
  let ueberschuss = 0;
  s.forEach((vorhanden, i) => {
    const erf = zeile.staffel[i];
    const diff = vorhanden + ueberschuss - erf;
    rows.push({ band: BAENDER[i].label, vorhanden, ueberschuss, erf, diff });
    ueberschuss = Math.max(diff, 0);
  });
  return { rows, ausserhalb, ausreichend: rows.every(r => r.diff >= 0), gesamt: rows.reduce((a, r) => a + r.diff, 0) };
}

/* Anhang C, Punkt 2: bemessungsrelevante Löschwasserrate QLWR und
   bereitzustellender Löschwasserbedarf QLWB = QLWO − QLWR.
   Bis 250 m dürfen auch vorhandene höhere Raten einfließen, darüber
   gilt der Wert der Tabelle 1 als Maximalwert. */
function bereitstellung(quellen, zeile, qLWO) {
  const { s } = staffelSummen(quellen);
  const qlwr = [s[0], s[1], Math.min(s[2], zeile.staffel[2])];
  const gedeckelt = s[2] > zeile.staffel[2];
  const summe = qlwr.reduce((a, b) => a + b, 0);
  const qLWB = qLWO - summe;
  return {
    zeilen: BAENDER.map((b, i) => ({ band: b.label, vorhanden: s[i], tabelle: zeile.staffel[i], qlwr: qlwr[i] })),
    summe, qLWB, gedeckelt,
    vLWB: qLWB * OS_LIEFERDAUER / 1000,
    ausreichend: qLWB <= 0
  };
}

/* ============================================================
   4) Hilfsfunktion – Entfernung zweier Koordinaten
   ============================================================ */
function haversine(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (c - a) * r, dLon = (d - b) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

      <td class="num">${nf(g.q)}</td><td class="num">${nf(g.q / 60, 1)}</td><td class="num">${nf(g.t, 1)}</td><td class="num">${nf(g.v)}</td>

      <td class="num">${g.staffel[2] ? 'weitere ' + nf(g.staffel[2]) : '–'}</td>

  calcBereitstellung();
}

function findNutzung(name) {
  if (!name) return null;
  const n = name.trim().toLowerCase();
  return ANHANG_A.find(a => a[1].toLowerCase() === n) || null;
}

function calcObjektschutz() {
  /* 1.1 immobile Brandbelastung */
  const wSel = val('osWand'), dSel = val('osDecke');
  document.getElementById('osWandMischWrap').style.display = wSel === 'm' ? 'block' : 'none';
  document.getElementById('osDeckeMischWrap').style.display = dSel === 'm' ? 'block' : 'none';
  const qWand = wSel === 'm' ? num('osWandMisch') : T5_WAND[+wSel].q;
  const qDecke = dSel === 'm' ? num('osDeckeMisch') : T6_DECKE[+dSel].q;
  set('osQiOut', `q<sub>LWi</sub> = q<sub>LWi-Wand</sub> + q<sub>LWi-Decke</sub> = ${nf(qWand, 2)} + ${nf(qDecke, 2)} = <b>${nf(qWand + qDecke, 2)} l/(m².min)</b>`);

  /* 1.2 mobile Brandbelastung */
  const manuell = document.getElementById('osQmManuell').checked;
  document.getElementById('osQmWrap').style.display = manuell ? 'block' : 'none';
  document.getElementById('osNutzungSuche').disabled = manuell;
  const treffer = findNutzung(val('osNutzungSuche'));
  const qm = manuell ? num('osQm') : (treffer ? treffer[3] : 0);
  if (manuell) {
    set('osNutzungOut', `<div class="note">Anteilsmäßig ermittelte spezifische Löschwasserrate: <b>${nf(qm, 2)} l/(m².min)</b>. Die gesonderte Berechnung ist dem Berechnungsblatt beizulegen.</div>`);
  } else if (treffer) {
    set('osNutzungOut', `<div class="note${treffer[4] ? ' warn' : ''}">
      <b>Lfd. Nr. ${treffer[0]} · ${esc(treffer[1])}</b><br>
      H<sub>u</sub> = ${nf(treffer[2], 1)} MJ/kg · q<sub>LWm</sub> = <b>${nf(treffer[3], 1)} l/(m².min)</b>
      ${treffer[4] ? '<br>Für diese Nutzung ist eine Berechnung des Löschwasserbedarfs grundsätzlich nicht erforderlich – es gelten die festgelegten Werte nach Punkt 5.' : ''}
    </div>`);
  } else {
    set('osNutzungOut', '<div class="empty">Keine Nutzung gewählt – q<sub>LWm</sub> = 0. Bitte eine Nutzung aus Anhang A wählen oder den Wert selbst festlegen.</div>');
  }

  /* 1.3 rechnerische Brandfläche */
  const baf = num('osBaf');
  const bf = brandflaeche(baf, val('osMassnahme'));
  set('osAbOut', `
    <div class="kpis">
      <div class="kpi"><small>Brandabschnittsfläche</small><strong>${nf(baf)} m²</strong></div>
      <div class="kpi"><small>Rechnerische Brandfläche A<sub>B</sub></small><strong>${nf(bf.ab)} m²</strong><em>${bf.reduziert ? 'reduziert nach Tabelle 7' : 'ohne Reduktion'}</em></div>
    </div>
    ${bf.reduziert ? `<div class="note">Reduktion auf ${nf(bf.limit)} m² zulässig: ${esc(bf.text)}</div>` : ''}`);

  /* 2. Berechnung */
  const lager = document.getElementById('osLager').checked;
  const hL = num('osHl');
  const r = objektschutz({ qWand, qDecke, qm, ab: bf.ab, lager, hL, gesprinklert: document.getElementById('osSprinkler').checked });

  set('osOut', `
    <div class="res-main"><strong>${nf(r.q)}</strong><span>l/min &nbsp;·&nbsp; Q<sub>LWO</sub></span>
      ${r.ueber8000 ? '<span class="pill bad">über 8.000 l/min</span>' : '<span class="pill ok">≤ 8.000 l/min</span>'}</div>
    <div class="kpis">
      <div class="kpi"><small>Löschwasservorrat V<sub>LWO</sub></small><strong>${nf(r.v, 1)} m³</strong><em>Lieferdauer 90 min</em></div>
      <div class="kpi"><small>q<sub>LWi</sub> + q<sub>LWm</sub></small><strong>${nf(r.qGes, 2)}</strong><em>l/(m².min)</em></div>
      <div class="kpi"><small>Angewandte Formel</small><strong>Punkt ${r.formel}</strong><em>${r.formel === '6.1.5' ? 'Lager über 2,5 m' : 'allgemein'}</em></div>
      <div class="kpi"><small>Löschwasserrückhaltung</small><strong>${nf(r.vRueckhalt, 1)} m³</strong><em>Punkt 8: −25 %</em></div>
    </div>
    <div class="table-wrap"><table>
      <tr><th>Schritt</th><th>Rechnung</th><th class="num">Ergebnis</th></tr>
      <tr><td>Q<sub>LWO-Allgemein</sub> (6.1.4)</td><td class="mono">(${nf(qWand, 2)} + ${nf(qDecke, 2)} + ${nf(qm, 2)}) × ${nf(bf.ab)} m²</td><td class="num">${nf(r.qAllgemein)} l/min</td></tr>
      ${r.qLager != null ? `<tr><td>Q<sub>LWO-Lager</sub> (6.1.5)</td><td class="mono">(${nf(r.qGes, 2)}) × [${nf(bf.ab)} + 4 × (${nf(hL, 1)} − 2,5) × √${nf(bf.ab)}]</td><td class="num">${nf(r.qLager)} l/min</td></tr>` : ''}
      ${r.gedeckelt ? `<tr><td>Deckelung gesprinklertes Lager</td><td class="mono">2 × Q<sub>LWO-Allgemein</sub></td><td class="num">${nf(2 * r.qAllgemein)} l/min</td></tr>` : ''}
      <tr><td><b>Q<sub>LWO</sub></b></td><td></td><td class="num"><b>${nf(r.q)} l/min</b></td></tr>
      <tr><td>V<sub>LWO</sub> (6.2)</td><td class="mono">${nf(r.q)} l/min × 90 min / 1.000</td><td class="num">${nf(r.v, 1)} m³</td></tr>
      <tr><td>Löschwasserrückhaltemenge (Punkt 8)</td><td class="mono">${nf(r.v, 1)} m³ × 0,75</td><td class="num">${nf(r.vRueckhalt, 1)} m³</td></tr>
    </table></div>
    ${r.hinweise.map(h => `<div class="note ${r.ueber8000 ? 'err' : 'warn'}">${esc(h)}</div>`).join('')}
    <div class="note">Weiter zur Gegenüberstellung mit dem vorhandenen Grundschutz: <button class="link" onclick="showPage('bereitstellung')">Löschwasserbereitstellung öffnen</button></div>`);

  window.lastObjektschutz = r;
  calcBereitstellung();
}

function quelleNeu() {
  const name = prompt('Bezeichnung der Löschwasserversorgungseinrichtung');
  if (!name) return;
  const q = parseFloat((prompt('Verfügbare Löschwasserrate Q_LW-Verfügbar [l/min]', '800') || '0').replace(',', '.')) || 0;
  const t = parseFloat((prompt('Lieferdauer t_LG [min]', '60') || '0').replace(',', '.')) || 0;
  const d = parseFloat((prompt('Entfernung zum Objekt [m]', '100') || '0').replace(',', '.')) || 0;
  state.quellen.push({ name, q, t, d });
  save(); calcBereitstellung();
}

function quelleWeg(i) {
  if (!confirm('Eintrag „' + state.quellen[i].name + '" löschen?')) return;
  state.quellen.splice(i, 1); save(); calcBereitstellung();
}

function calcBereitstellung() {
  if (!document.getElementById('quellenListe')) return;
  const zeile = T1_GRUNDSCHUTZ[parseInt(val('gsZeile') || '0', 10)];

  set('quellenListe', state.quellen.length ? `<div class="table-wrap"><table>
      <tr><th>Löschwasserversorgungseinrichtung</th><th class="num">Q<sub>LW-Verfügbar</sub></th><th class="num">t<sub>LG</sub></th><th class="num">V<sub>LW-Verfügbar</sub></th><th class="num">Entfernung</th><th></th></tr>
      ${state.quellen.map((x, i) => `<tr>
        <td><b>${esc(x.name)}</b></td>
        <td class="num">${nf(x.q)} l/min</td>
        <td class="num">${nf(x.t)} min</td>
        <td class="num">${nf(x.q * x.t / 1000, 1)} m³</td>
        <td class="num">${nf(x.d)} m</td>
        <td><button class="danger" onclick="quelleWeg(${i})">Löschen</button></td>
      </tr>`).join('')}
    </table></div>` : '<div class="empty">Noch keine Löschwasserversorgungseinrichtung erfasst.</div>');

  const b = beurteilungGrundschutz(state.quellen, zeile);
  set('bsGrundOut', `
    <p class="hint">Gewählte Bebauungsart: ${zeile.nr} · ${esc(zeile.text)} — <button class="link" onclick="showPage('grundschutz')">ändern</button></p>
    <div class="table-wrap"><table>
      <tr><th>Entfernung</th><th class="num">Q<sub>LW-Verfügbar</sub></th><th class="num">Überschuss aus vorheriger Staffel</th><th class="num">Q<sub>LWG</sub> lt. Tabelle 1</th><th class="num">Differenz</th></tr>
      ${b.rows.map(r => `<tr>
        <td>${esc(r.band)}</td>
        <td class="num">${nf(r.vorhanden)} l/min</td>
        <td class="num">${r.ueberschuss ? '+ ' + nf(r.ueberschuss) : '–'}</td>
        <td class="num">− ${nf(r.erf)} l/min</td>
        <td class="num"><b style="color:${r.diff < 0 ? 'var(--red)' : 'var(--green)'}">${r.diff >= 0 ? '+' : ''}${nf(r.diff)} l/min</b></td>
      </tr>`).join('')}
    </table></div>
    ${b.ausserhalb ? `<div class="note warn">${nf(b.ausserhalb)} l/min liegen weiter als 500 m entfernt und bleiben nach Tabelle 1 unberücksichtigt.</div>` : ''}
    <div class="note ${b.ausreichend ? '' : 'err'}">
      <b>${b.ausreichend ? 'Vorhandene Löschwasserversorgung ausreichend' : 'Vorhandene Löschwasserversorgung nicht ausreichend'}</b><br>
      ${b.ausreichend
        ? 'Die erforderlichen Löschwasserraten sind in den zulässigen Entfernungen abgedeckt. Mindest-Lieferdauer ' + nf(zeile.t, 1) + ' h, Mindest-Löschwasservorrat ' + nf(zeile.v) + ' m³ sind zusätzlich nachzuweisen.'
        : 'Negativwerte bedeuten: die Löschwasserversorgung deckt den Grundschutz nicht ab. Es sind entsprechende Verbesserungen aufgrund der gesetzlichen Verpflichtungen vorzunehmen.'}
    </div>`);

  const os = window.lastObjektschutz;
  if (!os) { set('bsObjektOut', '<div class="empty">Zuerst den Objektschutz berechnen.</div>'); return; }
  const r = bereitstellung(state.quellen, zeile, os.q);
  set('bsObjektOut', `
    <div class="table-wrap"><table>
      <tr><th>Entfernung</th><th class="num">Q<sub>LW-Verfügbar</sub></th><th class="num">Q<sub>LWG</sub> lt. Tabelle 1</th><th class="num">Q<sub>LWR</sub> bemessungsrelevant</th></tr>
      ${r.zeilen.map(z => `<tr><td>${esc(z.band)}</td><td class="num">${nf(z.vorhanden)} l/min</td><td class="num">${nf(z.tabelle)} l/min</td><td class="num"><b>${nf(z.qlwr)} l/min</b></td></tr>`).join('')}
      <tr><td><b>Gesamtsumme Q<sub>LWR</sub></b></td><td></td><td></td><td class="num"><b>${nf(r.summe)} l/min</b></td></tr>
    </table></div>
    <p class="hint">Bis 250 m dürfen auch vorhandene höhere Löschwasserraten einfließen; darüber gilt der Wert der Tabelle 1 als Maximalwert.${r.gedeckelt ? ' In der Staffel bis 500 m wurde daher gedeckelt.' : ''}</p>
    <div class="res-main" style="margin-top:14px"><strong>${nf(Math.max(r.qLWB, 0))}</strong><span>l/min bereitzustellen &nbsp;·&nbsp; Q<sub>LWB</sub></span></div>
    <div class="kpis">
      <div class="kpi"><small>Q<sub>LWO</sub> Objektschutz</small><strong>${nf(os.q)} l/min</strong></div>
      <div class="kpi"><small>Q<sub>LWR</sub> bemessungsrelevant</small><strong>${nf(r.summe)} l/min</strong></div>
      <div class="kpi"><small>V<sub>LWB</sub> bereitzustellen</small><strong>${nf(Math.max(r.vLWB, 0), 1)} m³</strong><em>90 min</em></div>
    </div>
    <div class="note ${r.ausreichend ? '' : 'err'}">
      <b>${r.ausreichend ? 'Vorhandene Löschwasserversorgung ausreichend' : 'Zusätzliche Löschwasserbereitstellung erforderlich'}</b><br>
      ${r.ausreichend
        ? 'Q<sub>LWB</sub> = ' + nf(r.qLWB) + ' l/min ≤ 0 – keine zusätzliche Löschwasserbereitstellung erforderlich.'
        : 'Die Differenz von ' + nf(r.qLWB) + ' l/min bzw. ' + nf(r.vLWB, 1) + ' m³ ist durch zusätzliche Löschwasserentnahmestellen in einer maximalen Entfernung von 125 m Gehweglänge zum Objekt bereitzustellen. Der entfernteste Gebäudezugang darf von diesen Entnahmestellen maximal 250 m Gehweglänge entfernt sein. Die Entnahmestellen müssen möglichst gleichmäßig verteilt situiert werden.'}
    </div>
    ${!r.ausreichend ? `<div class="note">Förderstrecke für ${nf(r.qLWB)} l/min planen: <button class="link" onclick="uebernehmeBedarf(${Math.round(r.qLWB)})">In die Förderstrecke übernehmen</button></div>` : ''}`);
}

function uebernehmeBedarf(q) {
  const el = document.getElementById('fsQ');
  if (el) { el.value = Math.max(0, Math.round(q)); calcFoerder(); }
  showPage('foerder');
}

            </select>
          </label>
          <label>Pumpenausgangsdruck [bar]<input id="fsPOut" type="number" step="0.5" min="1" value="8" oninput="calcFoerder()"></label>
          <label>Mindesteingangsdruck [bar]<input id="fsPIn" type="number" step="0.5" min="0" value="1.5" oninput="calcFoerder()"></label>
          <label>Solldruck am Leitungsende [bar]<input id="fsPEnd" type="number" step="0.5" min="0" value="5" oninput="calcFoerder()"><span class="hint">Verteiler bzw. Eingang der Angriffspumpe</span></label>
          <label>Schlauchlänge je Stück [m]<input id="fsSeg" type="number" value="20" disabled></label>
        </div>
      </div>
      <div class="card eval">
        <h3>Ergebnis</h3>
        <div id="fsOut" class="result"></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3>Pumpenaufstellung</h3>
      <div class="table-wrap"><table id="fsTable"></table></div>
      <div id="fsHinweise"></div>
    </div>
  </section>`;
}

function calcFoerder() {
  const hose = val('fsHose') || 'B75';
  const segEl = document.getElementById('fsSeg');
  if (segEl) segEl.value = HOSE[hose].len;
  const r = foerderstrecke({
    q: num('fsQ'), length: num('fsL'), dh: num('fsH'), hose: hose,
    pOut: num('fsPOut'), pInMin: num('fsPIn'), pEnd: num('fsPEnd')
  });

  if (r.err) {
    set('fsOut', `<div class="note err">${esc(r.err)}</div>`);
    set('fsTable', '');
    set('fsHinweise', '');
    return;
  }

  set('fsOut', `
    <div class="res-main"><strong>${r.pumps.length}</strong><span>Pumpen gesamt</span></div>
    <div class="kpis">
      <div class="kpi"><small>Schläuche</small><strong>${nf(r.nHose)}</strong><em>+ ${nf(r.reserve)} Reserve</em></div>
      <div class="kpi"><small>Reibungsverlust</small><strong>${nf(r.fricTotal, 1)} bar</strong><em>${nf(r.lp100, 2)} bar je 100 m</em></div>
      <div class="kpi"><small>Höhendruck</small><strong>${nf(r.hTotal, 1)} bar</strong><em>${nf(num('fsH'), 0)} m</em></div>
      <div class="kpi"><small>Gesamtdruckbedarf</small><strong>${nf(r.pressureDemand, 1)} bar</strong><em>inkl. Solldruck</em></div>
      <div class="kpi"><small>Restdruck am Ende</small><strong>${nf(r.pEndReal, 1)} bar</strong><em>${r.pEndReal >= num('fsPEnd') - 1e-6 ? 'Sollwert erreicht' : 'zu gering'}</em></div>
      <div class="kpi"><small>Wasserinhalt Leitung</small><strong>${nf(r.volume, 0)} l</strong><em>Füllzeit ${nf(r.fillMin, 1)} min</em></div>
      <div class="kpi"><small>Größter Pumpenabstand</small><strong>${nf(r.maxSpan, 0)} m</strong><em>zwischen zwei Pumpen</em></div>
      <div class="kpi"><small>Fördermenge</small><strong>${nf(num('fsQ'))} l/min</strong><em>${nf(num('fsQ') * 60 / 1000, 1)} m³/h</em></div>
    </div>`);

  const par = HOSE[hose].parallel;
  const rows = r.sections.map((s, i) => `<tr>
      <td><b>Pumpe ${s.nr}</b><br><small style="color:var(--muted)">${esc(s.art)}</small></td>
      <td class="num">${nf(s.from, 0)} m</td>
      <td class="num">${i === 0 ? '–' : nf(r.sections[i - 1].pEnd, 1) + ' bar'}</td>
      <td class="num">${nf(s.pStart, 1)} bar</td>
      <td class="num">${nf(s.len, 0)} m</td>
      <td class="num">${nf(s.hoses * par)}</td>
      <td class="num">${nf(s.pEnd, 1)} bar</td>
    </tr>`).join('');
  set('fsTable', `<tr><th>Position</th><th class="num">Standort ab Entnahme</th><th class="num">Eingangsdruck</th><th class="num">Ausgangsdruck</th><th class="num">Abschnittslänge</th><th class="num">Schläuche</th><th class="num">Druck am Abschnittsende</th></tr>${rows}`);

  const hinweise = r.warn.map(w => `<div class="note warn">${esc(w)}</div>`).join('');
  set('fsHinweise', hinweise + `<details>
    <summary>Rechenweg</summary>
    <table>
      <tr><td>Reibungsverlust je 100 m bei ${nf(num('fsQ'))} l/min</td><td class="num">${nf(r.lp100, 2)} bar</td></tr>
      <tr><td>Reibungsverlust gesamt (${nf(num('fsL'))} m)</td><td class="num">${nf(r.fricTotal, 2)} bar</td></tr>
      <tr><td>Höhendruck (${nf(num('fsH'))} m × 0,1 bar/m)</td><td class="num">${nf(r.hTotal, 2)} bar</td></tr>
      <tr><td>Solldruck am Leitungsende</td><td class="num">${nf(num('fsPEnd'), 2)} bar</td></tr>
      <tr><td><b>Gesamtdruckbedarf</b></td><td class="num"><b>${nf(r.pressureDemand, 2)} bar</b></td></tr>
      <tr><td>Nutzbare Druckdifferenz je Verstärkerpumpe</td><td class="num">${nf(num('fsPOut') - num('fsPIn'), 2)} bar</td></tr>
      <tr><td>Schlauchlänge je Stück</td><td class="num">${nf(r.hoseLen)} m</td></tr>
      <tr><td>Druckverlust je Schlauch (Reibung + Höhe)</td><td class="num">${nf(r.lossHose, 2)} bar</td></tr>
      <tr><td>Schläuche je Zwischenabschnitt (max.)</td><td class="num">${r.lossHose > 0 ? Math.floor((num('fsPOut') - num('fsPIn')) / r.lossHose) : '–'}</td></tr>
      <tr><td>Schläuche im Endabschnitt (max.)</td><td class="num">${r.lossHose > 0 ? Math.floor((num('fsPOut') - num('fsPEnd')) / r.lossHose) : '–'}</td></tr>
    </table>
  </details>`);
}

/* ---------------- Strahlrohre ---------------- */
function pageVerbrauch() {
  return `<section class="page" id="verbrauch">
    <div class="section-head">
      <div><span class="eyebrow">Modul 3</span><h2>Strahlrohre und Verbrauch</h2><p>Wasserverbrauch der eingesetzten Rohre</p></div>
    </div>
    <div class="grid two">
      <div class="card">
        <h3>Eingesetzte Rohre</h3>
        <div class="rowlist">
          ${ROHRE.map(r => `<div class="rowitem">
            <div class="grow"><b>${esc(r.label)}</b><small>${nf(r.q)} l/min</small></div>
            <button class="secondary" style="padding:6px 11px" onclick="rohrStep('${r.id}',-1)">−</button>
            <input class="qty" id="rohr_${r.id}" type="number" min="0" step="1" value="${state.rohre[r.id] || 0}" oninput="calcVerbrauch()">
            <button class="secondary" style="padding:6px 11px" onclick="rohrStep('${r.id}',1)">+</button>
          </div>`).join('')}
        </div>
      </div>
      <div class="card eval">
        <h3>Ergebnis</h3>
        <div class="form-grid" style="margin-bottom:14px">
          <label>Einsatzdauer [min]<input id="vbDauer" type="number" step="5" min="0" value="30" oninput="calcVerbrauch()"></label>
          <label>Verfügbarer Vorrat [m³]<input id="vbVorrat" type="number" step="1" min="0" value="0" oninput="calcVerbrauch()"><span class="hint">0 = nicht bewerten</span></label>
        </div>
        <div id="vbOut" class="result"></div>
      </div>
    </div>
  </section>`;
}

function rohrStep(id, d) {
  const el = document.getElementById('rohr_' + id);
  el.value = Math.max(0, (parseInt(el.value, 10) || 0) + d);
  calcVerbrauch();
}

function calcVerbrauch() {
  let q = 0;
  const zeilen = [];
  ROHRE.forEach(r => {
    const n = parseInt(val('rohr_' + r.id) || '0', 10) || 0;
    state.rohre[r.id] = n;
    if (n > 0) { q += n * r.q; zeilen.push(`<tr><td>${n} × ${esc(r.label)}</td><td class="num">${nf(n * r.q)} l/min</td></tr>`); }
  });
  save();
  const dauer = num('vbDauer');
  const menge = q * dauer / 1000;
  const vorrat = num('vbVorrat');
  let bew = '';
  if (vorrat > 0 && q > 0) {
    const min = vorrat * 1000 / q;
    const ok = min >= dauer;
    bew = `<div class="note ${ok ? '' : 'err'}"><b>${ok ? 'Vorrat ausreichend' : 'Vorrat zu gering'}:</b> ${nf(vorrat, 0)} m³ reichen bei ${nf(q)} l/min für <b>${nf(min, 0)} Minuten</b> (${nf(min / 60, 1)} h). Benötigt: ${nf(dauer, 0)} min.</div>`;
  }
  set('vbOut', `
    <div class="res-main"><strong>${nf(q)}</strong><span>l/min gesamt</span></div>
    <div class="kpis">
      <div class="kpi"><small>Menge in ${nf(dauer, 0)} min</small><strong>${nf(menge, 1)} m³</strong><em>${nf(q * dauer)} Liter</em></div>
      <div class="kpi"><small>Durchfluss</small><strong>${nf(q / 60, 1)} l/s</strong><em>${nf(q * 60 / 1000, 1)} m³/h</em></div>
      <div class="kpi"><small>Als B-Leitung</small><strong>${nf(lossPer100('B75', q), 2)} bar</strong><em>Verlust je 100 m</em></div>
    </div>
    ${zeilen.length ? `<div class="table-wrap"><table>${zeilen.join('')}<tr><td><b>Summe</b></td><td class="num"><b>${nf(q)} l/min</b></td></tr></table></div>` : '<div class="empty">Noch keine Rohre gewählt.</div>'}
    ${bew}
    ${q > 0 ? `<button class="link" style="margin-top:10px" onclick="uebernehmeBedarf(${q})">${nf(q)} l/min in die Förderstrecke übernehmen</button>` : ''}`);
}

/* ---------------- Vorrat ---------------- */
function pageVorrat() {
  return `<section class="page" id="vorrat">
    <div class="section-head">
      <div><span class="eyebrow">Modul 4</span><h2>Löschwasservorrat</h2><p>Behälter, Zisterne, Löschteich und offenes Gewässer</p></div>
    </div>
    <div class="grid two">
      <div class="card">
        <h3>Geometrie</h3>
        <label>Form
          <select id="vrForm" onchange="calcVorrat(true)">
            <option value="rechteck">Rechteckiger Behälter / Becken</option>
            <option value="zylinder">Zylinder stehend (Zisterne)</option>
            <option value="direkt">Volumen direkt eingeben</option>
          </select>
        </label>
        <div class="form-grid" style="margin-top:12px" id="vrFelder"></div>
        <div class="form-grid" style="margin-top:12px">
          <label>Nutzbarer Anteil [%]<input id="vrNutz" type="number" step="5" min="0" max="100" value="80" oninput="calcVorrat()"><span class="hint">Restwasser, Schlamm, Saugkorbüberdeckung</span></label>
          <label>Entnahme [l/min]<input id="vrQ" type="number" step="100" min="0" value="800" oninput="calcVorrat()"></label>
        </div>
        <div class="form-grid" style="margin-top:12px">
          <label>Geodätische Saughöhe [m]<input id="vrSaug" type="number" step="0.5" min="0" value="3" oninput="calcVorrat()"><span class="hint">Wasserspiegel bis Pumpenmitte</span></label>
          <label>Zufluss [l/min]<input id="vrZu" type="number" step="50" min="0" value="0" oninput="calcVorrat()"><span class="hint">natürlicher Nachlauf</span></label>
        </div>
      </div>
      <div class="card eval">
        <h3>Ergebnis</h3>
        <div id="vrOut" class="result"></div>
      </div>
    </div>
  </section>`;
}

function vorratFelder() {
  const f = val('vrForm') || 'rechteck';
  if (f === 'rechteck') {
    return `<label>Länge [m]<input id="vrA" type="number" step="0.1" min="0" value="10" oninput="calcVorrat()"></label>
            <label>Breite [m]<input id="vrB" type="number" step="0.1" min="0" value="6" oninput="calcVorrat()"></label>
            <label>Wassertiefe [m]<input id="vrC" type="number" step="0.1" min="0" value="2" oninput="calcVorrat()"></label>`;
  }
  if (f === 'zylinder') {
    return `<label>Durchmesser [m]<input id="vrA" type="number" step="0.1" min="0" value="3" oninput="calcVorrat()"></label>
            <label>Wasserstand [m]<input id="vrB" type="number" step="0.1" min="0" value="4" oninput="calcVorrat()"></label>`;
  }
  return `<label>Volumen [m³]<input id="vrA" type="number" step="1" min="0" value="100" oninput="calcVorrat()"></label>`;
}

function calcVorrat(rebuild) {
  if (rebuild) set('vrFelder', vorratFelder());
  const f = val('vrForm') || 'rechteck';
  let v = 0;
  if (f === 'rechteck') v = num('vrA') * num('vrB') * num('vrC');
  else if (f === 'zylinder') v = Math.PI / 4 * Math.pow(num('vrA'), 2) * num('vrB');
  else v = num('vrA');

  const nutz = v * (num('vrNutz') / 100);
  const q = num('vrQ');
  const zu = num('vrZu');
  const netto = q - zu;
  const min = netto > 0 ? nutz * 1000 / netto : Infinity;
  const saug = num('vrSaug');
  const saugWarn = saug > 7.5
    ? `<div class="note err"><b>Saughöhe zu groß:</b> ${nf(saug, 1)} m überschreiten die praktisch erreichbare geodätische Saughöhe von rund 7,5 m. Pumpe tiefer aufstellen oder Tauchpumpe einsetzen.</div>`
    : saug > 6
      ? `<div class="note warn"><b>Grenzbereich:</b> Bei ${nf(saug, 1)} m Saughöhe sinkt die Pumpenleistung deutlich. Saugleitung kurz halten.</div>`
      : '';

  set('vrOut', `
    <div class="res-main"><strong>${nf(nutz, 1)}</strong><span>m³ nutzbar</span></div>
    <div class="kpis">
      <div class="kpi"><small>Gesamtvolumen</small><strong>${nf(v, 1)} m³</strong><em>${nf(v * 1000, 0)} Liter</em></div>
      <div class="kpi"><small>Reichweite</small><strong>${isFinite(min) ? nf(min, 0) + ' min' : 'unbegrenzt'}</strong><em>${isFinite(min) ? nf(min / 60, 1) + ' h' : 'Zufluss ≥ Entnahme'}</em></div>
      <div class="kpi"><small>Netto-Entnahme</small><strong>${nf(Math.max(netto, 0))} l/min</strong><em>abzüglich Zufluss</em></div>
      <div class="kpi"><small>Saughöhe</small><strong>${nf(saug, 1)} m</strong><em>Grenze rund 7,5 m</em></div>
    </div>
    ${saugWarn}
    <div class="note">Faustwert: ${nf(nutz, 1)} m³ entsprechen ${nf(nutz * 1000 / 400, 0)} Minuten Betrieb eines B-Rohres mit Mundstück (400 l/min).</div>`);
}

/* ---------------- Hydranten ---------------- */
let hydPos = null;
function pageHydranten() {
  return `<section class="page" id="hydranten">
    <div class="section-head">
      <div><span class="eyebrow">Modul 5</span><h2>Wasserentnahmestellen</h2><p>Hydranten, Saugstellen und Löschwasserbehälter</p></div>
      <div class="toolbar">
        <button class="secondary" onclick="hydOrten()">Standort ermitteln</button>
        <button class="secondary" onclick="exportJSON()">Export</button>
        <button class="primary" onclick="hydNeu()">Entnahmestelle anlegen</button>
      </div>
    </div>
    <div id="hydList"></div>
  </section>`;
}

function renderHydranten() {
  const list = state.hydranten.map((h, i) => Object.assign({}, h, { _i: i }));
  if (hydPos) list.forEach(h => { h._d = (h.lat != null && h.lon != null) ? haversine(hydPos.lat, hydPos.lon, h.lat, h.lon) : null; });
  if (hydPos) list.sort((a, b) => (a._d == null ? 1e12 : a._d) - (b._d == null ? 1e12 : b._d));

  const sum = state.hydranten.reduce((s, h) => s + (parseFloat(h.leistung) || 0), 0);
  set('hydList', `
    <div class="card eval" style="margin-bottom:16px">
      <div class="kpis">
        <div class="kpi"><small>Entnahmestellen</small><strong>${state.hydranten.length}</strong></div>
        <div class="kpi"><small>Summe Leistung</small><strong>${nf(sum)} l/min</strong><em>rechnerisch</em></div>
        <div class="kpi"><small>Standort</small><strong>${hydPos ? nf(hydPos.lat, 4) + ' / ' + nf(hydPos.lon, 4) : '–'}</strong><em>${hydPos ? 'Sortierung nach Entfernung' : 'nicht ermittelt'}</em></div>
      </div>
    </div>
    ${list.length ? `<div class="card"><div class="table-wrap"><table>
      <tr><th>Bezeichnung</th><th>Typ</th><th class="num">Leistung</th><th class="num">Ruhedruck</th><th class="num">Entfernung</th><th>Notiz</th><th></th></tr>
      ${list.map(h => `<tr>
        <td><b>${esc(h.name)}</b></td>
        <td><span class="pill">${esc(h.typ)}</span></td>
        <td class="num">${nf(h.leistung)} l/min</td>
        <td class="num">${h.druck ? nf(h.druck, 1) + ' bar' : '–'}</td>
        <td class="num">${h._d != null ? nf(h._d, 0) + ' m' : '–'}</td>
        <td><small>${esc(h.notiz || '')}</small></td>
        <td><button class="danger" onclick="hydWeg(${h._i})">Löschen</button></td>
      </tr>`).join('')}
    </table></div></div>` : '<div class="empty">Noch keine Entnahmestellen erfasst.</div>'}`);
}

function hydNeu() {
  const name = prompt('Bezeichnung der Entnahmestelle');
  if (!name) return;
  const typ = prompt('Typ (Überflurhydrant, Unterflurhydrant, Saugstelle, Löschwasserbehälter)', 'Überflurhydrant') || 'Hydrant';
  const leistung = parseFloat((prompt('Ergiebigkeit in l/min', '800') || '0').replace(',', '.')) || 0;
  const druck = parseFloat((prompt('Ruhedruck in bar (0 wenn unbekannt)', '4') || '0').replace(',', '.')) || 0;
  const notiz = prompt('Notiz (optional)', '') || '';
  let lat = null, lon = null;
  if (hydPos && confirm('Aktuellen Standort als Koordinate übernehmen?')) { lat = hydPos.lat; lon = hydPos.lon; }
  state.hydranten.push({ name, typ, leistung, druck, lat, lon, notiz });
  save(); renderHydranten(); renderKpis();
}

function hydWeg(i) {
  if (!confirm('Entnahmestelle „' + state.hydranten[i].name + '" löschen?')) return;
  state.hydranten.splice(i, 1); save(); renderHydranten(); renderKpis();
}

function hydOrten() {
  if (!navigator.geolocation) { alert('Standortbestimmung wird von diesem Browser nicht unterstützt.'); return; }
  navigator.geolocation.getCurrentPosition(
    p => { hydPos = { lat: p.coords.latitude, lon: p.coords.longitude }; renderHydranten(); },
    () => alert('Standort konnte nicht ermittelt werden. Ortungsdienste prüfen.'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function pageObjekte() {
  return `<section class="page" id="objekte">
    <div class="section-head">
      <div><span class="eyebrow">Modul 6</span><h2>Gespeicherte Objekte</h2><p>Berechnungen benennen, wieder aufrufen und weitergeben</p></div>

}

function renderObjekte() {
  set('objList', state.objekte.length ? `<div class="card"><div class="table-wrap"><table>
      <tr><th>Objekt</th><th>Erfasst</th><th class="num">Grundschutz</th><th class="num">Objektschutz</th><th class="num">Förderstrecke</th><th></th></tr>
      ${state.objekte.map((o, i) => `<tr>
        <td><b>${esc(o.name)}</b><br><small style="color:var(--muted)">${esc(o.notiz || '')}</small></td>

function objektSpeichern() {
  const name = prompt('Bezeichnung des Objekts / Einsatzes');
  if (!name) return;
  const notiz = prompt('Notiz (optional)', '') || '';
  const zeile = T1_GRUNDSCHUTZ[parseInt(val('gsZeile') || '0', 10)];
  const os = window.lastObjektschutz || { q: 0, v: 0 };
  state.objekte.push({
    name, notiz,
    datum: new Date().toLocaleDateString('de-AT'),
    qG: zeile.q, qO: Math.round(os.q), vO: os.v,
    gs: { zeile: val('gsZeile'), spezial: val('gsSpezial') },
    os: {
      wand: val('osWand'), wandMisch: num('osWandMisch'), decke: val('osDecke'), deckeMisch: num('osDeckeMisch'),
      nutzung: val('osNutzungSuche'), qmManuell: !!document.getElementById('osQmManuell').checked, qm: num('osQm'),
      baf: num('osBaf'), hl: num('osHl'), massnahme: val('osMassnahme'),
      lager: !!document.getElementById('osLager').checked, sprinkler: !!document.getElementById('osSprinkler').checked
    },
    fs: { q: num('fsQ'), length: num('fsL'), dh: num('fsH'), hose: val('fsHose'), pOut: num('fsPOut'), pIn: num('fsPIn'), pEnd: num('fsPEnd') },
    quellen: structuredClone(state.quellen)
  });
  save(); renderObjekte(); renderKpis();
  showPage('objekte');
}

function objektLaden(i) {
  const o = state.objekte[i];
  const setv = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };
  const setc = (id, v) => { const el = document.getElementById(id); if (el) el.checked = !!v; };
  if (o.gs) { setv('gsZeile', o.gs.zeile); setv('gsSpezial', o.gs.spezial); }
  if (o.os) {
    setv('osWand', o.os.wand); setv('osWandMisch', o.os.wandMisch);
    setv('osDecke', o.os.decke); setv('osDeckeMisch', o.os.deckeMisch);
    setv('osNutzungSuche', o.os.nutzung); setc('osQmManuell', o.os.qmManuell); setv('osQm', o.os.qm);
    setv('osBaf', o.os.baf); setv('osHl', o.os.hl); setv('osMassnahme', o.os.massnahme);
    setc('osLager', o.os.lager); setc('osSprinkler', o.os.sprinkler);
  }
  if (o.fs) {
    setv('fsQ', o.fs.q); setv('fsL', o.fs.length); setv('fsH', o.fs.dh);
    setv('fsHose', o.fs.hose || 'B75'); setv('fsPOut', o.fs.pOut); setv('fsPIn', o.fs.pIn); setv('fsPEnd', o.fs.pEnd);
  }
  if (Array.isArray(o.quellen)) { state.quellen = structuredClone(o.quellen); save(); }
  calcGrundschutz(); calcObjektschutz(); calcFoerder();
  showPage('grundschutz');
}

function objektWeg(i) {
  if (!confirm('Objekt „' + state.objekte[i].name + '" löschen?')) return;
  state.objekte.splice(i, 1); save(); renderObjekte(); renderKpis();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify({ objekte: state.objekte, hydranten: state.hydranten }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'loeschwasser-daten.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (Array.isArray(d.objekte)) state.objekte = state.objekte.concat(d.objekte);
        if (Array.isArray(d.hydranten)) state.hydranten = state.hydranten.concat(d.hydranten);
        save(); renderObjekte(); renderHydranten(); renderKpis();
        alert('Daten importiert.');
      } catch (e) { alert('Datei konnte nicht gelesen werden.'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

function renderAnhangA() {
  const f = (val('infoFilter') || '').trim().toLowerCase();
  const list = f ? ANHANG_A.filter(a => a[1].toLowerCase().includes(f)) : ANHANG_A;
  set('anhangATabelle', `<tr><th class="num">Lfd. Nr.</th><th>Nutzung</th><th class="num">H<sub>u</sub> [MJ/kg]</th><th class="num">q<sub>LW</sub> [l/(m².min)]</th></tr>
    ${list.map(a => `<tr><td class="num">${a[0]}${a[4] ? '*)' : ''}</td><td>${esc(a[1])}</td><td class="num">${nf(a[2], 1)}</td><td class="num"><b>${nf(a[3], 1)}</b></td></tr>`).join('')
    || '<tr><td colspan="4">Keine Nutzung gefunden.</td></tr>'}`);
}

function alleLoeschen() {
  if (!confirm('Wirklich alle lokal gespeicherten Daten löschen?')) return;
  state = structuredClone(defaults);
  save(); renderObjekte(); renderHydranten(); renderKpis();
  alert('Lokale Daten gelöscht.');
}

/* ============================================================
   Rendering und Navigation
   ============================================================ */
function renderKpis() {
  set('kpiObj', String(state.objekte.length));
  set('kpiHyd', String(state.hydranten.length));
}

function showPage(id) {
  window.currentPage = id;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === id));
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === id));
  const n = NAV.find(x => x[0] === id);
  document.getElementById('pageTitle').textContent = n ? n[1] : '';
  /* replaceState statt location.hash: verhindert den Ankersprung des Browsers */
  /* Präfix "#/" verwenden: so trifft der Fragmentbezeichner keine Element-ID
     und der Browser springt beim Aufruf eines Links nicht an den Anker. */
  try { history.replaceState(null, '', '#/' + id); } catch (e) { }
  window.scrollTo(0, 0);
  requestAnimationFrame(() => window.scrollTo(0, 0));
}

function init() {
  document.getElementById('nav').innerHTML = NAV
    .map(n => `<button data-page="${n[0]}" onclick="showPage('${n[0]}')"><b>${n[2]}</b><span>${n[1]}</span></button>`).join('');
  document.getElementById('pages').innerHTML =
    pageStart() + pageGrundschutz() + pageObjektschutz() + pageBereitstellung() + pageFoerder() +
    pageVerbrauch() + pageVorrat() + pageHydranten() + pageObjekte() + pageInfo();

  calcGrundschutz();
  calcObjektschutz();
  calcFoerder();
  calcVerbrauch();
  calcVorrat(true);
  renderHydranten();
  renderObjekte();
  renderAnhangA();
  renderKpis();

  const start = (location.hash || '').replace(/^#\/?/, '');
  showPage(NAV.some(n => n[0] === start) ? start : 'start');
}

init();
</script>
