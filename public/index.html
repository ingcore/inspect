.brand img,.topbar-brand-logo{display:block;object-fit:contain;max-width:100%;height:auto}.brand img{width:118px;min-width:118px}.topbar-brand-logo{width:112px;min-width:96px}

.object-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.object-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.object-card{padding:17px;border:1px solid var(--line);border-radius:10px;background:#fff}
.object-card h3{margin:0 0 6px;font-size:18px}
.object-card p{margin:5px 0;color:var(--muted)}
.object-card .object-meta{min-height:74px}
.object-card .actions{margin-top:13px}
.object-form{margin-bottom:18px}
.object-form[hidden]{display:none}
.object-information{margin:12px 0 0;padding:12px 13px;border-left:4px solid var(--accent);border-radius:7px;background:#f5f7f7;color:#455158;white-space:pre-wrap;line-height:1.45}
.object-information b{display:block;color:var(--text);margin-bottom:4px}
.report-choice{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:800px){.object-grid{grid-template-columns:1fr}}


.object-search{min-width:280px;flex:1;max-width:520px;border:1px solid #cfd8dc;border-radius:8px;padding:10px 12px;background:#fff}
.maintenance-box{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.maintenance-box h4{margin:0 0 9px}
.maintenance-list{display:grid;gap:7px;margin-bottom:10px}
.maintenance-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#f8fafb}
.maintenance-item.due{border-color:#e2a4a4;background:#fff1f1}
.maintenance-item.soon{border-color:#e8ce85;background:#fff9e8}
.maintenance-item.ok{border-color:#b8d8bd;background:#f1faf2}
.maintenance-status{font-size:12px;font-weight:750}
.maintenance-add{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px}
.reminder-banner{margin-bottom:16px;padding:14px 16px;border:1px solid #e2a4a4;background:#fff1f1;border-radius:10px}
.reminder-banner h3{margin:0 0 6px;color:#9e2020}
.reminder-banner p{margin:4px 0}
.object-no-results{grid-column:1/-1}
@media(max-width:720px){.maintenance-add{grid-template-columns:1fr}.object-search{max-width:none;width:100%}}

function dashboard(){let total=Object.values(db.archives).flat().length;let counts=Object.fromEntries(Object.keys(TYPES).map(k=>[k,db.archives[k].length]));let desc={revision:'Revision starten und einen eigenen Revisionsbericht mit Prüfergebnissen und Nachverfolgung erzeugen.',abnahme:'Abnahme dokumentieren, Restpunkte erfassen und einen vollständigen Abnahmebericht ausgeben.',feuerbeschau:'Brandschutzreport erstellen und Feststellungen, Maßnahmen sowie Fotodokumentation im eigenen Bericht dokumentieren.'};document.querySelector('#dashboard').innerHTML=`<p class="dashboard-subtitle">Wähle die gewünschte Berichtsart direkt über eine eigene Kachel aus.</p><div class="report-tiles">${Object.entries(TYPES).map(([k,t])=>`<article class="card report-tile ${k}" role="button" tabindex="0" onclick="openType('${k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openType('${k}')}"><div><div class="report-tile-head"><div class="report-tile-icon">${t.icon}</div><div class="report-tile-count"><b>${counts[k]}</b><span>im eigenen Archiv</span></div></div><h2>${t.label}</h2><p>${desc[k]}</p></div><div class="report-tile-actions"><button class="btn primary" onclick="event.stopPropagation();openTypeAndCreate('${k}')">+ Neu anlegen</button><button class="btn" onclick="event.stopPropagation();openTypeArchive('${k}')">Archiv öffnen</button></div></article>`).join('')}</div><div class="layout"><div><div class="card panel"><h3>Berichte nach Art</h3><div class="summary-chart">${Object.entries(TYPES).map(([k,t])=>`<div class="bar" style="height:${Math.max(12,counts[k]*25)}px"><b>${counts[k]}</b><span>${t.prefix}</span></div>`).join('')}</div></div><div class="card panel safety-score-box" style="margin-top:18px"><div class="safety-score-head"><div><h3 style="margin:0 0 5px">Offizieller SAFETY SCORE</h3><div class="safety-caption">Risikorang beziehungsweise erforderlicher Performance Level. A kennzeichnet den günstigsten, E den kritischsten Risikorang.</div></div><img src="${reportAsset('safety-score-logo.png')}" alt="SAFETY SCORE"></div><img class="safety-score-scale" src="safety-score-scale.png" alt="Safety-Score-Skala A bis E"><div class="safety-score-legend">${['A','B','C','D','E'].map(x=>`<div>${scoreSymbol(x,'small')}<br><b>${x}</b><br>${SAFETY_SCORE_INFO[x]}</div>`).join('')}</div></div></div><div class="card panel"><h3>Teststand</h3><p>Alle drei Berichtsarten besitzen ein getrenntes Archiv und vorausgefüllte Beispielmängel mit lokalen Bildern.</p><div class="notice">Aktuell ${total} gespeicherte Testberichte.</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Aktuelle Gesamtbewertungen</h3>${Object.entries(TYPES).map(([k,t])=>{let r=db.archives[k][0];return `<p><b>${t.label}</b><br>${r?scoreSymbol(r.overall,'compact'):'–'}</p>`}).join('')}</div></div>`}
function typeView(type){let t=TYPES[type];let ar=db.archives[type];document.querySelector('#'+type).innerHTML=`<div class="card hero"><div><h2>${t.report}</h2><p>${t.label} durchführen, Beispielmängel prüfen und als PDF ausgeben.</p></div><div class="actions"><button class="btn primary" onclick="createSample('${type}')">+ Beispielbericht erstellen</button><button class="btn" onclick="renderType('${type}','archive')">Archiv (${ar.length})</button></div></div><div id="${type}-content"></div>`;renderType(type,ar.length?'archive':'new')}
function renderType(type,mode){let root=document.querySelector('#'+type+'-content');if(mode==='archive'){let ar=db.archives[type];root.innerHTML=`<div class="card panel"><h3>Archiv ${TYPES[type].report}</h3>${ar.length?`<div class="archive-list">${ar.map(r=>`<article class="archive-item"><header><b>${esc(r.number)} · ${esc(r.object.name)}</b>${scoreSymbol(r.overall,'compact')}</header><p>${esc(r.object.address)} · ${dateDE(r.created)}</p><small>${r.defects.length} Feststellungen · ${r.status}</small><div class="actions"><button class="btn dark" onclick="openPdf('${type}','${r.id}')">PDF öffnen</button><button class="btn" onclick="editReport('${type}','${r.id}')">Ansehen / bearbeiten</button><button class="btn danger" onclick="removeReport('${type}','${r.id}')">Löschen</button></div></article>`).join('')}</div>`:'<div class="empty">Noch keine Berichte gespeichert. Erstelle einen Beispielbericht.</div>'}</div>`;return} if(mode==='new'){root.innerHTML='<div class="empty">Über „Beispielbericht erstellen“ wird ein vollständig ausgefüllter Testbericht angelegt.</div>';return}}
function createSample(type){let n=db.archives[type].length+1;let now=new Date();let report={id:crypto.randomUUID(),type,number:`${TYPES[type].prefix}-${now.getFullYear()}-${String(n).padStart(4,'0')}`,created:now.toISOString(),status:'Testbericht',object:{...db.object},defects:sampleDefects(type),overall:'D',summary:'Die festgestellten Mängel sind entsprechend ihrer Priorität zu bearbeiten. Akute Beeinträchtigungen von Fluchtwegen und brandschutztechnischen Einrichtungen sind unverzüglich zu beheben.',signature:'Ing. Erika Beispiel'};db.archives[type].unshift(report);save();editReport(type,report.id)}
function editReport(type,id){let r=db.archives[type].find(x=>x.id===id);let root=document.querySelector('#'+type+'-content');root.innerHTML=`<div class="layout"><div><div class="card panel"><h3>${esc(r.number)} · ${TYPES[type].report}</h3><div class="formgrid"><div class="field"><label>Objekt</label><input id="objname" value="${esc(r.object.name)}"></div><div class="field"><label>Adresse des Objektes</label><input id="objaddress" value="${esc(r.object.address)}"></div><div class="field"><label>Auftraggeber</label><input id="client" value="${esc(r.object.client)}"></div><div class="field"><label>Prüfer</label><input id="inspector" value="${esc(r.object.inspector)}"></div><div class="field span2"><label>Zusammenfassung</label><textarea id="summary">${esc(r.summary)}</textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="saveReportEdit('${type}','${id}')">Änderungen speichern</button><button class="btn dark" onclick="openPdf('${type}','${id}')">PDF öffnen</button><button class="btn" onclick="renderType('${type}','archive')">Zum Archiv</button></div></div><div class="defects">${r.defects.map((d,i)=>defectCard(type,id,d,i)).join('')}</div></div><aside class="card panel"><h3>Berichtsdaten</h3><p><b>Berichtsart:</b><br>${TYPES[type].report}</p><p><b>Berichtsnummer:</b><br>${r.number}</p><p><b>Feststellungen:</b><br>${r.defects.length}</p><p><b>Gesamtbewertung:</b></p>${scoreSymbol(r.overall)}<p class="safety-caption"><b>Safety Score ${r.overall}</b><br>${SAFETY_SCORE_INFO[r.overall]||''}<br>Risikorang / Performance Level</p><div class="notice">Die PDF enthält die Objektadresse direkt auf der ersten Seite und keine separate leere Titelseite.</div></aside></div>`}
function defectCard(type,id,d,i){return `<article class="defect"><div><img src="${d.photo}" alt="Mängelfoto"><label class="btn" style="display:block;text-align:center;margin-top:7px">Foto aufnehmen / Galerie<input type="file" accept="image/*" capture="environment" hidden onchange="updateDefectPhoto('${type}','${id}','${d.id}',this)"></label></div><div><h4>${i+1}. ${esc(d.title)}</h4><small>${esc(d.area)}</small><p><b>Feststellung:</b> ${esc(d.finding)}</p><p><b>Maßnahme:</b> ${esc(d.measure)}</p><div class="actions"><select onchange="updateScore('${type}','${id}','${d.id}',this.value)">${['A','B','C','D','E'].map(s=>`<option ${d.score===s?'selected':''}>${s}</option>`).join('')}</select><select onchange="updateStatus('${type}','${id}','${d.id}',this.value)">${['offen','in Bearbeitung','erledigt'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>${scoreSymbol(d.score,'compact')}</article>`}
function updateDefectPhoto(type,id,did,input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Bitte eine Bilddatei auswählen.');return}const reader=new FileReader();reader.onload=()=>{const report=db.archives[type].find(x=>x.id===id),defect=report&&report.defects.find(x=>x.id===did);if(!defect)return;defect.photo=reader.result;save();editReport(type,id)};reader.onerror=()=>alert('Das Foto konnte nicht gelesen werden.');reader.readAsDataURL(file)}
function saveReportEdit(type,id){let r=db.archives[type].find(x=>x.id===id);r.object.name=document.querySelector('#objname').value;r.object.address=document.querySelector('#objaddress').value;r.object.client=document.querySelector('#client').value;r.object.inspector=document.querySelector('#inspector').value;r.summary=document.querySelector('#summary').value;db.object={...r.object};save();alert('Bericht gespeichert.')} function updateScore(type,id,did,v){let r=db.archives[type].find(x=>x.id===id),d=r.defects.find(x=>x.id===did);d.score=v;r.overall=['E','D','C','B','A'].find(s=>r.defects.some(x=>x.score===s))||'A';save();editReport(type,id)} function updateStatus(type,id,did,v){db.archives[type].find(x=>x.id===id).defects.find(x=>x.id===did).status=v;save()} function removeReport(type,id){if(confirm('Bericht wirklich löschen?')){db.archives[type]=db.archives[type].filter(x=>x.id!==id);save();typeView(type);dashboard()}}
function reportHtml(r){let t=TYPES[r.type],base=location.href.replace(/[^/]*$/,'');return `<!doctype html><html lang="de"><head><meta charset="utf-8"><base href="${base}"><title>${r.number}</title><style>@page{size:A4;margin:18mm 15mm 17mm}html{-webkit-print-color-adjust:exact;print-color-adjust:exact}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#20272b;margin:0;font-size:10.5pt}.toolbar{position:fixed;top:10px;right:10px;z-index:5}@media print{.toolbar{display:none}}button{padding:10px 14px}.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:4px solid #b8d51b;padding-bottom:12px;margin-bottom:18px}.head img{width:120px}.head .num{text-align:right;color:#5f6a70}.address{background:#eef2f3;border-left:6px solid #b8d51b;padding:20px;margin:8px 0 20px}.address h1{font-size:25pt;margin:0 0 12px}.address h2{font-size:17pt;margin:0}.meta{width:100%;border-collapse:collapse;margin-bottom:22px}.meta td{border:1px solid #d8dfe2;padding:8px}.meta td:first-child{width:30%;color:#68747a}.summary{padding:14px;border:1px solid #d8dfe2;margin-bottom:18px}.defect{page-break-inside:avoid;border-top:2px solid #29343a;padding:12px 0;display:grid;grid-template-columns:44mm 1fr 34mm;gap:11px}.defect img{width:44mm;height:33mm;object-fit:cover}.defect h3{margin:0 0 5px;font-size:12pt}.defect p{margin:4px 0}.score-symbol,.safety-symbol{width:32mm;height:auto;object-fit:contain}.safety-symbol.compact{width:30mm}.score-logo{width:48mm!important;height:auto}.score-overall{display:flex;align-items:center;gap:5mm}.score-explain{font-size:8.5pt;color:#5f6a70}.score-method{border:1px solid #b8bec2;background:#d7dbde;padding:10px;margin:0 0 18px;page-break-inside:avoid}.score-method-head{display:flex;align-items:center;justify-content:space-between;gap:10mm}.score-method-head img{width:45mm}.score-method-scale{width:75mm;background:#bfc4c7;padding:2mm}.score-method p{margin:5px 0 0}.foot{margin-top:24px;border-top:1px solid #aeb8bd;padding-top:10px;display:flex;justify-content:space-between}.signature{margin-top:34px}.signature div{width:75mm;border-top:1px solid #333;padding-top:5px}.topbar-brand-logo{width:112px;height:auto;display:block;object-fit:contain;flex:0 0 auto}.topbar-heading{display:flex;align-items:center;gap:16px;min-width:0}.topbar-heading h1{white-space:nowrap}@media(max-width:850px){.topbar-brand-logo{width:96px}.topbar-heading{width:100%}}@media(max-width:520px){.topbar-heading{align-items:flex-start;flex-direction:column;gap:8px}.topbar-heading h1{white-space:normal}}

</style></head><body><div class="toolbar"><button onclick="window.print()">Als PDF speichern / drucken</button></div><header class="head"><img src="${reportAsset('ingtec-logo.png')}" alt="INGTEC"><div class="num"><b>${t.report}</b><br>${esc(r.number)}<br>${dateDE(r.created)}</div></header><section class="address"><h1>${t.report}</h1><h2>${esc(r.object.name)}</h2><p style="font-size:15pt;margin:8px 0 0"><b>${esc(r.object.address)}</b></p></section><table class="meta"><tr><td>Auftraggeber</td><td>${esc(r.object.client)}</td></tr><tr><td>Ansprechpartner</td><td>${esc(r.object.contact||'–')}</td></tr><tr><td>Prüfer / Sachverständiger</td><td>${esc(r.object.inspector)}</td></tr><tr><td>Gesamtbewertung</td><td><div class="score-overall"><img class="score-symbol" src="${scoreAsset(r.overall)}"><div><b>Safety Score ${r.overall}</b><br><span class="score-explain">${SAFETY_SCORE_INFO[r.overall]||''}</span></div></div></td></tr></table><section class="score-method"><div class="score-method-head"><img class="score-logo" src="${reportAsset('safety-score-logo.png')}" alt="SAFETY SCORE"><img class="score-method-scale" src="${reportAsset('safety-score-scale.png')}" alt="Skala A bis E"></div><p><b>Bewertungsgrundlage:</b> Risikorang beziehungsweise erforderlicher Performance Level. Die Symbolik reicht von A (geringes Risiko) bis E (hohes Risiko).</p></section><section class="summary"><h2>Zusammenfassung</h2><p>${esc(r.summary)}</p></section><h2>Feststellungen und Maßnahmen</h2>${r.defects.map((d,i)=>`<article class="defect"><img src="${reportAsset(d.photo)}" alt="Mängelfoto"><div><h3>${i+1}. ${esc(d.title)}</h3><p><b>Bereich:</b> ${esc(d.area)}</p><p><b>Feststellung:</b> ${esc(d.finding)}</p><p><b>Maßnahme:</b> ${esc(d.measure)}</p><p><b>Status:</b> ${esc(d.status)}</p></div>${scoreSymbol(d.score,'compact')}</article>`).join('')}<div class="signature"><div>${esc(r.signature)} · Prüfer / Sachverständiger</div></div><footer class="foot"><span>${esc(db.settings.footer)}</span><span>${r.number}</span></footer></body></html>`}
function ensurePdfPreview(){
  let modal=document.getElementById('pdfPreviewModal');
  if(modal)return modal;
  modal=document.createElement('div');
  modal.id='pdfPreviewModal';
  modal.innerHTML=`<div class="pdf-preview-shell">
    <div class="pdf-preview-bar">
      <div><b>PDF-Druckvorschau</b><small>Im Druckdialog „Microsoft Print to PDF“ oder „Als PDF speichern“ auswählen.</small></div>
      <div class="actions"><button class="btn primary" id="pdfPrintButton">Als PDF speichern / drucken</button><button class="btn" id="pdfCloseButton">Schließen</button></div>
    </div>
    <iframe id="pdfPreviewFrame" title="PDF-Druckvorschau"></iframe>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#pdfCloseButton').onclick=closePdfPreview;
  modal.addEventListener('click',e=>{if(e.target===modal)closePdfPreview()});
  return modal;
}
function closePdfPreview(){let modal=document.getElementById('pdfPreviewModal');if(modal){modal.classList.remove('open');let f=modal.querySelector('iframe');setTimeout(()=>{if(!modal.classList.contains('open'))f.srcdoc=''},180)}}
function waitForPdfImages(doc){let imgs=[...doc.images];if(!imgs.length)return Promise.resolve();return Promise.all(imgs.map(img=>{if(img.complete&&img.naturalWidth>0)return Promise.resolve();return new Promise(resolve=>{img.onload=resolve;img.onerror=()=>{img.outerHTML='<span style=\"display:inline-block;border:2px solid #222;padding:8px;font-weight:700\">Safety Score '+(img.alt||'Bild')+'</span>';resolve()}})})) }
function printPdfPreview(){
  let frame=document.getElementById('pdfPreviewFrame');
  if(!frame||!frame.contentWindow)return alert('Die Druckvorschau ist noch nicht bereit.');
  waitForPdfImages(frame.contentDocument).then(()=>{frame.contentWindow.focus();frame.contentWindow.print()});
}
function openPdf(type,id){
  let r=(db.archives[type]||[]).find(x=>x.id===id);
  if(!r){alert('Der Bericht wurde nicht gefunden.');return}
  let modal=ensurePdfPreview(),frame=modal.querySelector('#pdfPreviewFrame');
  modal.classList.add('open');
  frame.onload=()=>{modal.querySelector('#pdfPrintButton').onclick=printPdfPreview};
  frame.srcdoc=reportHtml(r);
  modal.querySelector('#pdfPrintButton').onclick=printPdfPreview;
}


let objectSearchTerm='';
function dateOnly(value){return value?new Date(value+'T12:00:00'):null}
function dayDiff(value){
  const d=dateOnly(value); if(!d)return null;
  const t=new Date();t.setHours(12,0,0,0);
  return Math.ceil((d-t)/86400000);
}
function maintenanceState(item){
  const diff=dayDiff(item.dueDate);
  if(diff===null)return {cls:'',label:'Kein Termin'};
  if(diff<0)return {cls:'due',label:`Seit ${Math.abs(diff)} Tag(en) überfällig`};
  if(diff===0)return {cls:'due',label:'Heute fällig'};
  if(diff<=30)return {cls:'soon',label:`In ${diff} Tag(en) fällig`};
  return {cls:'ok',label:`Fällig am ${new Date(item.dueDate+'T12:00:00').toLocaleDateString('de-DE')}`};
}
function dueMaintenances(){
  return db.objects.flatMap(o=>(o.maintenance||[])
    .filter(m=>dayDiff(m.dueDate)<=0)
    .map(m=>({object:o,item:m})));
}
function reminderBanner(){
  const due=dueMaintenances();
  if(!due.length)return '';
  return `<div class="reminder-banner"><h3>⚠ ${due.length} Wartung${due.length===1?' ist':'en sind'} fällig</h3>
    ${due.slice(0,5).map(x=>`<p><b>${esc(x.object.name)}:</b> ${esc(x.item.title)} – ${maintenanceState(x.item).label}</p>`).join('')}
    ${due.length>5?`<p>und ${due.length-5} weitere …</p>`:''}
  </div>`;
}

      <button class="btn primary" style="margin-top:14px" onclick="saveObject()">${edit?'Änderungen speichern':'Objekt speichern'}</button>

    <div class="card panel">
      <div class="object-toolbar">
        <div><h2 style="margin:0">Objekte</h2><p style="margin:5px 0 0;color:var(--muted)">${filtered.length} von ${db.objects.length} Objekten angezeigt</p></div>

                    <button class="btn danger" title="Wartung löschen" onclick="removeMaintenance('${o.id}','${m.id}')">Löschen</button>
                  </div>`}).join(''):'<small style="color:var(--muted)">Noch keine Wartungsfälligkeit eingetragen.</small>'}
              </div>
              <div class="maintenance-add">
                <input id="mt-${o.id}" placeholder="z. B. Feuerlöscher warten">
                <input id="md-${o.id}" type="date">
                <button class="btn primary" onclick="addMaintenance('${o.id}')">+ Eintragen</button>
              </div>
            </div>
          </article>`).join(''):`<div class="empty object-no-results">Keine Objekte zur Suche „${esc(objectSearchTerm)}“ gefunden.</div>`}
      </div>
    </div>`;
  setTimeout(()=>{const s=document.querySelector('#objectSearch');if(s&&q)s.focus()},0);
}
function filterObjects(value){objectSearchTerm=value;objectsView()}
function openNewObjectForm(){
  objectsView('__new__');
  const p=document.querySelector('#objectFormPanel');
  if(p){p.hidden=false;p.scrollIntoView({behavior:'smooth',block:'start'});}
  objectId.value='';
  o1.value='';o2.value='';o3.value='';o4.value='';o5.value='Ing. Erika Beispiel';o6.value='';
}
function closeObjectForm(){objectsView()}
function saveObject(){
  const existing=db.objects.find(o=>o.id===objectId.value);
  const data={id:objectId.value||crypto.randomUUID(),name:o1.value.trim(),address:o2.value.trim(),client:o3.value.trim(),contact:o4.value.trim(),inspector:o5.value.trim(),information:o6.value.trim(),maintenance:existing?.maintenance||[]};
  if(!data.name||!data.address){alert('Bitte Objektname und Adresse eingeben.');return}
  const index=db.objects.findIndex(o=>o.id===data.id);
  if(index>=0)db.objects[index]=data;else db.objects.unshift(data);
  db.object={...data};
  save();objectsView();alert(index>=0?'Objekt wurde aktualisiert.':'Objekt wurde gespeichert.');
}
function deleteObject(id){
  const o=db.objects.find(x=>x.id===id);
  if(!o||!confirm(`Objekt „${o.name}“ wirklich löschen?`))return;
  db.objects=db.objects.filter(x=>x.id!==id);
  if(db.object&&db.object.id===id)db.object={...(db.objects[0]||{})};
  save();objectsView();
}
function addMaintenance(objectId){
  const o=db.objects.find(x=>x.id===objectId);
  const title=document.getElementById(`mt-${objectId}`).value.trim();
  const dueDate=document.getElementById(`md-${objectId}`).value;
  if(!title||!dueDate){alert('Bitte Wartungsart und Fälligkeitsdatum eintragen.');return}
  if(!Array.isArray(o.maintenance))o.maintenance=[];
  o.maintenance.push({id:crypto.randomUUID(),title,dueDate,created:new Date().toISOString()});
  o.maintenance.sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  save();objectsView();checkMaintenanceReminders(true);
}
function removeMaintenance(objectId,maintenanceId){
  const o=db.objects.find(x=>x.id===objectId);if(!o)return;
  const m=(o.maintenance||[]).find(x=>x.id===maintenanceId);
  if(!m||!confirm(`Wartungsfälligkeit „${m.title}“ löschen?`))return;
  o.maintenance=o.maintenance.filter(x=>x.id!==maintenanceId);
  save();objectsView();
}
async function requestReminderPermission(){
  if(!('Notification' in window)){alert('Dieser Browser unterstützt keine Systembenachrichtigungen. Die fälligen Wartungen werden weiterhin innerhalb der App angezeigt.');return}
  try{
    const result=await Notification.requestPermission();
    alert(result==='granted'?'Systembenachrichtigungen wurden aktiviert.':'Die Berechtigung wurde nicht erteilt. Erinnerungen bleiben innerhalb der App sichtbar.');
    checkMaintenanceReminders(true);
  }catch(e){alert('Systembenachrichtigungen konnten nicht aktiviert werden. Die App zeigt fällige Wartungen weiterhin intern an.')}
}
function checkMaintenanceReminders(force=false){
  const due=dueMaintenances(); if(!due.length)return;
  const today=new Date().toISOString().slice(0,10);
  const key='ingtec-maintenance-reminder-'+today;
  if(!force&&localStorage.getItem(key))return;
  if('Notification' in window&&Notification.permission==='granted'){
    due.slice(0,5).forEach(x=>new Notification('INGTEC – Wartung fällig',{body:`${x.object.name}: ${x.item.title} (${maintenanceState(x.item).label})`}));
  }
  localStorage.setItem(key,'1');
}
function createReportForObject(type,objectId){
  const object=db.objects.find(o=>o.id===objectId);
  if(!object)return;
  let n=db.archives[type].length+1,now=new Date();
  let report={id:crypto.randomUUID(),type,number:`${TYPES[type].prefix}-${now.getFullYear()}-${String(n).padStart(4,'0')}`,created:now.toISOString(),status:'Entwurf',object:{...object},defects:sampleDefects(type),overall:'D',summary:'Die festgestellten Mängel sind entsprechend ihrer Priorität zu bearbeiten. Akute Beeinträchtigungen sind unverzüglich zu beheben.',signature:object.inspector||'Ing. Erika Beispiel'};
  db.archives[type].unshift(report);db.object={...object};save();show(type);setTimeout(()=>editReport(type,report.id),0);
}
function settingsView(){document.querySelector('#settings').innerHTML=`<div class="card panel"><h3>Einstellungen</h3><p>Die Anwendung speichert alle Daten lokal im Browserprofil dieses Windows-Benutzers.</p><div class="actions"><button class="btn" onclick="exportData()">Datensicherung exportieren</button><button class="btn danger" onclick="resetData()">Testdaten zurücksetzen</button></div><p class="footer-note">SharePoint-Synchronisation ist in dieser Offline-Prüfversion bewusst nicht aktiv.</p></div>`} function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='INGTEC_Datensicherung.json';a.click();URL.revokeObjectURL(a.href)} function resetData(){if(confirm('Alle lokal gespeicherten Berichte löschen?')){localStorage.removeItem('ingtec-full-db');location.reload()}}
function openType(k){document.querySelector(`[data-view="${k}"]`).click()} function openTypeAndCreate(k){openType(k);setTimeout(()=>createSample(k),0)} function openTypeArchive(k){openType(k);setTimeout(()=>renderType(k,'archive'),0)} function show(v){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===v));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));pageTitle.textContent=v==='dashboard'?'Dashboard':v==='objects'?'Objekte':v==='settings'?'Einstellungen':TYPES[v].label;if(TYPES[v])typeView(v);if(v==='dashboard')dashboard();if(v==='objects')objectsView();if(v==='settings')settingsView()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));save();dashboard();objectsView();settingsView();checkMaintenanceReminders();setInterval(checkMaintenanceReminders,3600000);Object.keys(TYPES).forEach(type=>{if(!db.archives[type].length){let n=1,now=new Date();db.archives[type].push({id:crypto.randomUUID(),type,number:`${TYPES[type].prefix}-${now.getFullYear()}-${String(n).padStart(4,'0')}`,created:now.toISOString(),status:'Testbericht',object:{...db.object},defects:sampleDefects(type),overall:'E',summary:'Vorausgefüllter Beispielbericht zur Prüfung von Aufbau, Fotos, Feststellungen, Maßnahmen und PDF-Formatierung.',signature:'Ing. Erika Beispiel'})}});save();dashboard();
</script></body></html>
