<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9DC31A">
<title>INGTEC Inspect</title>
<style>
:root{--ing:#9dc31a;--ing-dark:#5f7600;--ink:#111820;--muted:#667085;--bg:#eef1f4;--white:rgba(255,255,255,.84);--eval:rgba(225,228,232,.82);--red:#d92d20;--yellow:#b77900;--green:#5f7600;--a:#00a651;--b:#78d71d;--c:#ffe45c;--d:#f7b500;--e:#f04400;--radius:22px;--shadow:0 16px 48px rgba(16,24,40,.09);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);background:radial-gradient(circle at 7% 0,rgba(157,195,26,.13),transparent 28%),linear-gradient(180deg,#f9fbfc,#eef1f4);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:20px 15px;background:rgba(18,23,27,.93);backdrop-filter:blur(26px);color:white;z-index:20}.brand{display:flex;align-items:center;gap:12px;padding:7px 9px 20px}.brandmark{width:42px;height:42px;border-radius:14px;background:var(--ing);color:#131a00;display:grid;place-items:center;font-size:23px;font-weight:900}.brand strong{font-size:22px}.brand small{display:block;color:var(--ing);letter-spacing:.18em;font-size:10px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#d5dbe0;padding:12px 13px;border-radius:14px;text-align:left}.nav button:hover,.nav button.active{background:rgba(255,255,255,.09);color:white}.nav button.active{box-shadow:inset 4px 0 0 var(--ing)}.nav span{flex:1}.badge{background:#353c43;border-radius:999px;padding:2px 7px;font-size:11px}.syncbox{position:absolute;left:15px;right:15px;bottom:18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:17px;padding:13px}.syncbox b{color:var(--ing)}.syncbox small{display:block;color:#aab3bb;margin-top:4px}.main{min-width:0}.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:15px;padding:17px 26px;background:rgba(249,251,252,.77);backdrop-filter:blur(22px);border-bottom:1px solid rgba(255,255,255,.85)}.top h1{font-size:24px;margin:0}.search{margin-left:auto;min-width:330px;background:var(--white);border:1px solid white;border-radius:15px;padding:11px 14px;color:var(--muted)}.avatar{width:42px;height:42px;border-radius:50%;background:#1b2228;color:white;display:grid;place-items:center;font-weight:800}.content{max-width:1550px;margin:auto;padding:27px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:18px}.hero{grid-template-columns:1.45fr .85fr}.kpis{grid-template-columns:repeat(4,1fr);margin:18px 0}.two{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--white);backdrop-filter:blur(20px) saturate(125%);border:1px solid rgba(255,255,255,.82);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}.evaluation{background:var(--eval)}.hero-card{min-height:225px;display:flex;align-items:flex-end;justify-content:space-between;background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(246,249,240,.82))}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ing-dark);font-weight:800}h2{font-size:34px;margin:7px 0 10px}h3{margin:0 0 7px;font-size:19px}p{color:var(--muted);line-height:1.5}.primary{border:0;background:var(--ing);color:#182000;font-weight:800;padding:12px 17px;border-radius:13px}.secondary{border:1px solid #d4d9df;background:white;color:var(--ink);font-weight:700;padding:11px 15px;border-radius:13px}.link{border:0;background:transparent;color:var(--ing-dark);font-weight:800;padding:0}.metric strong{display:block;font-size:31px;margin:8px 0}.metric small{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.section-head p{margin:4px 0 0}.progress{height:8px;background:#dce1e5;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--ing)}table{width:100%;border-collapse:collapse}th,td{padding:13px 11px;border-bottom:1px solid rgba(16,24,40,.08);text-align:left;font-size:14px}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;background:#f2f4f7;font-size:12px;font-weight:800}.source-red{color:var(--red);border-left:4px solid var(--red)}.source-yellow{color:#875e00;border-left:4px solid #f0b429}.source-green{color:var(--ing-dark);border-left:4px solid var(--ing)}.status-card{padding:14px;border-radius:15px;background:white;margin:9px 0}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{font-size:12px;font-weight:800;color:#475467}input,select,textarea{width:100%;margin-top:6px;border:1px solid #d6dce2;background:white;border-radius:12px;padding:11px}textarea{min-height:90px}.inspection{display:grid;grid-template-columns:235px minmax(0,1fr) 315px;gap:16px}.chapter{width:100%;display:flex;justify-content:space-between;border:0;background:transparent;padding:11px;border-radius:12px;text-align:left}.chapter.active{background:rgba(157,195,26,.14);color:var(--ing-dark);font-weight:800}.question{background:white;border:1px solid #e3e7eb;border-radius:16px;padding:16px;margin-bottom:10px}.answers{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.answers button{border:1px solid #d0d5dd;background:white;border-radius:999px;padding:7px 10px;font-size:12px}.answers button.active{border-color:var(--ing);box-shadow:0 0 0 3px rgba(157,195,26,.17)}.score{position:relative;max-width:340px;margin:8px auto 14px;padding-top:58px}.score-title{position:absolute;top:0;left:0;right:0;border:4px solid #101419;border-radius:18px;background:white;text-align:center;font-size:26px;font-weight:900;letter-spacing:.03em;padding:8px}.chevrons{display:flex;align-items:flex-start;justify-content:center;gap:0}.chev{width:58px;height:44px;clip-path:polygon(0 0,72% 0,100% 50%,72% 100%,0 100%,29% 50%);margin-left:-12px;display:grid;place-items:center;color:white;font-weight:900;font-size:12px;transform-origin:50% 0;transition:.25s}.chev:first-child{margin-left:0}.chev.active{transform:scale(1.38);z-index:2;filter:drop-shadow(0 7px 7px rgba(0,0,0,.2))}.A{background:var(--a)}.B{background:var(--b)}.C{background:var(--c);color:#755d00}.D{background:var(--d);color:#6d4800}.E{background:var(--e)}.score-value{text-align:center;font-weight:800;margin-top:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.quality{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quality>div{background:white;border-radius:15px;padding:15px}.quality strong{font-size:28px;display:block}.locked{opacity:.55}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}.mobile-menu{display:none}
@media(max-width:1100px){.app{grid-template-columns:82px 1fr}.brand>div:last-child,.nav span,.nav .badge,.syncbox{display:none}.side{padding:17px 11px}.inspection{grid-template-columns:190px 1fr}.inspection>.card:last-child{grid-column:1/-1}.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}.side{position:fixed;left:0;right:0;top:auto;bottom:0;height:74px;padding:8px;z-index:30}.brand,.syncbox{display:none}.nav{display:flex;overflow-x:auto}.nav button{min-width:64px;justify-content:center;padding:10px}.nav button.active{box-shadow:inset 0 -4px 0 var(--ing)}.top{padding:13px 15px}.top h1{font-size:20px}.search{display:none}.content{padding:15px 15px 94px}.hero,.kpis,.two,.three,.inspection,.form-grid{grid-template-columns:1fr}.hero-card{display:block;min-height:270px}h2{font-size:28px}.hero-card .primary{margin-top:14px}table{display:block;overflow-x:auto}.score-title{font-size:21px}.quality{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="brandmark">I</div><div><strong>INGTEC</strong><small>INSPECT</small></div></div><nav class="nav" id="nav"></nav><div class="syncbox"><b id="syncState">● Synchronisiert</b><small>SharePoint · Odoo · Offline-Speicher</small></div></aside>
<main class="main"><header class="top"><h1 id="pageTitle">Übersicht</h1><div class="search">⌕ Prüfung, Objekt oder Dokument suchen</div><button class="secondary" id="syncBtn">↻ Sync</button><div class="avatar">HS</div></header><div class="content" id="pages"></div></main>
</div>
<script>
const defaults={answers:{},sources:{q1:'green',q2:'yellow',q3:'red',q4:'green',q5:'green',q6:'green',q7:'yellow',q8:'green'},findings:[{id:'F01',title:'Sicherheitsleuchte ohne Funktion',type:'Wesentlicher Mangel',due:'10.08.2026',status:'Offen'},{id:'F02',title:'Brandschott nicht gekennzeichnet',type:'Abweichung',due:'30.08.2026',status:'Offen'},{id:'F03',title:'Wartungsnachweis fehlt',type:'Nachweis fehlt',due:'05.08.2026',status:'Nachweis hochgeladen'}],score:82};
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem('ingtecInspect')||'{}')}}catch(e){return structuredClone(defaults)}}let state=load();function save(){try{localStorage.setItem('ingtecInspect',JSON.stringify(state))}catch(e){}}
const questions=[['q1','Dokumentation','Aktuelle Anlagendokumentation vollständig vorhanden?'],['q2','Brandmeldezentrale','Brandmeldezentrale zugänglich, beschriftet und ohne Störmeldung?'],['q3','Meldergruppen','Stichprobenprüfung der automatischen Brandmelder ordnungsgemäß?'],['q4','Alarmierung','Akustische und optische Alarmierung funktionsfähig?'],['q5','Brandfallsteuerung','Brandfallsteuerungen entsprechend Matrix ausgelöst?'],['q6','Feuerwehrperipherie','Feuerwehrbedienfeld und Anzeigetableau funktionsfähig?'],['q7','Übertragung','Übertragungseinrichtung und Alarmweiterleitung geprüft?'],['q8','Abschluss','Betriebsbuch ergänzt und Betreiber unterwiesen?']];
const nav=[['dashboard','Übersicht','⌂'],['master','Unternehmen','▦'],['inspection','Prüfung','✓'],['findings','Feststellungen','!'],['measures','Maßnahmen','⚑'],['reports','Berichte','▤'],['documents','Dokumente','□'],['customer','Kundenportal','◉']];
function grade(n){return n>=90?'A':n>=80?'B':n>=65?'C':n>=50?'D':'E'}function recalc(){const vals=Object.values(state.answers);const done=vals.filter(Boolean).length;const bad=vals.filter(v=>v==='failed').length;state.score=Math.max(0,Math.round(100-(questions.length-done)*3-bad*12-state.findings.filter(f=>f.status!=='Erledigt').length*2));save();render()}
function score(){const g=grade(state.score);return `<div class="score"><div class="score-title">SAFETY SCORE</div><div class="chevrons">${['A','B','C','D','E'].map(x=>`<div class="chev ${x} ${x===g?'active':''}">${x}</div>`).join('')}</div><div class="score-value">Safety-Score® ${g} · ${state.score} von 100 Punkten</div></div>`}
function source(s){return s==='red'?'<span class="pill source-red">Ungeprüft – vollständig prüfen</span>':s==='yellow'?'<span class="pill source-yellow">Vorperiode – aktualisieren</span>':'<span class="pill source-green">Verifiziert – kurz sichten</span>'}
function dashboard(){return `<section class="page active" id="dashboard"><div class="grid hero"><div class="card hero-card"><div><span class="eyebrow">INGTEC Prüfsystem</span><h2>Guten Tag, Hannes.</h2><p>Der BMA-Prüfprozess ist vorbereitet. Rote und gelbe Quelleninhalte müssen vor der Berichtsfreigabe fachlich geprüft werden.</p><button class="primary" onclick="showPage('inspection')">Prüfung fortsetzen</button></div><div>${score()}</div></div><div class="card evaluation"><span class="eyebrow">Prüfbereitschaft</span><h3>72 % vollständig</h3><div class="progress"><span style="width:72%"></span></div><div class="status-card source-red">1 ungeprüfter Inhalt</div><div class="status-card source-yellow">2 Inhalte aus Vorperiode</div><div class="status-card source-green">5 verifizierte Inhalte</div></div></div><div class="grid kpis"><div class="card metric"><small>Prüfungen im Monat</small><strong>128</strong><button class="link" onclick="showPage('inspection')">Prüfungen ansehen</button></div><div class="card metric"><small>Offene Berichte</small><strong>7</strong><button class="link" onclick="showPage('reports')">Zur Qualitätssicherung</button></div><div class="card metric evaluation"><small>Offene Maßnahmen</small><strong>${state.findings.filter(f=>f.status!=='Erledigt').length}</strong><button class="link" onclick="showPage('measures')">Maßnahmen öffnen</button></div><div class="card evaluation">${score()}</div></div><div class="grid two"><div class="card"><div class="section-head"><div><h3>Heute</h3><p>Termine und operative Prioritäten</p></div><button class="link">Kalender öffnen</button></div><table><tr><th>Zeit</th><th>Prüfung</th><th>Kunde</th><th>Status</th></tr><tr><td>08:30</td><td><b>BMA-Prüfung</b></td><td>Reinbold GmbH</td><td><span class="pill">Vor Ort</span></td></tr><tr><td>11:30</td><td>§ 82b-Begehung</td><td>P&amp;G Health Austria</td><td>Geplant</td></tr><tr><td>15:00</td><td>Arbeitsplatzevaluierung</td><td>Kärntnermilch GmbH</td><td>Geplant</td></tr></table></div><div class="card"><h3>Schnellzugriff</h3><div class="grid two" style="margin-top:14px"><button class="primary" onclick="showPage('inspection')">Neue Prüfung</button><button class="secondary" onclick="showPage('documents')">SharePoint-Akte</button><button class="secondary">QR-Code scannen</button><button class="secondary" onclick="showPage('reports')">Bericht erstellen</button></div></div></div></section>`}
function master(){return `<section class="page" id="master"><div class="section-head"><div><h2>Unternehmensmaster</h2><p>Zentrale technische Kunden- und Objektakte</p></div><button class="primary">Objekt hinzufügen</button></div><div class="grid two"><div class="card"><div class="form-grid"><label>Unternehmen<input value="Reinbold GmbH"></label><label>Kundennummer<input value="406"></label><label>Standort<input value="9800 Spittal an der Drau"></label><label>Behörde<input value="BH Spittal an der Drau"></label><label>Technische Leitung<input value="Max Mustermann"></label><label>Nächste Prüfung<input type="date" value="2027-05-18"></label></div></div><div class="card evaluation"><h3>Objektbewertung</h3>${score()}<div class="status-card">Offene Maßnahmen: <b>${state.findings.length}</b></div><div class="status-card">Fehlende Unterlagen: <b>3</b></div></div></div><div class="card" style="margin-top:18px"><h3>Objektstruktur</h3><table><tr><th>Ebene</th><th>Bezeichnung</th><th>Typ</th><th>Status</th></tr><tr><td>Unternehmen</td><td>Reinbold GmbH</td><td>Kunde</td><td>Aktiv</td></tr><tr><td>Standort</td><td>Spittal</td><td>Betriebsanlage</td><td>Aktiv</td></tr><tr><td>Gebäude</td><td>Produktionshalle</td><td>GK 4</td><td>In Betrieb</td></tr><tr><td>Anlage</td><td>BMA-01</td><td>Brandmeldeanlage</td><td>Prüfung läuft</td></tr></table></div></section>`}
function inspection(){const done=Object.values(state.answers).filter(Boolean).length;return `<section class="page" id="inspection"><div class="section-head"><div><span class="eyebrow">BMA-01 · Reinbold GmbH</span><h2>Wiederkehrende BMA-Prüfung</h2><p>${done} von ${questions.length} Prüfpunkten bearbeitet</p></div><div class="toolbar"><button class="secondary">Offline-Paket</button><button class="secondary">Plan</button><button class="primary" onclick="showPage('reports')">Prüfung abschließen</button></div></div><div class="progress"><span style="width:${done/questions.length*100}%"></span></div><div class="inspection" style="margin-top:18px"><div class="card"><h3>Prüfkapitel</h3>${questions.map((q,i)=>`<button class="chapter ${i===0?'active':''}"><span>${q[1]}</span><b>${state.answers[q[0]]?'1':'0'}/1</b></button>`).join('')}</div><div class="card">${questions.map(q=>`<div class="question"><b>${q[2]}</b><p>${q[1]} · Prüfgrundlage gemäß Prüfprofil</p>${source(state.sources[q[0]])}<div class="answers">${[['fulfilled','Erfüllt'],['partial','Teilweise'],['failed','Nicht erfüllt'],['not_testable','Nicht prüfbar'],['evidence','Nachweis fehlt']].map(a=>`<button class="${state.answers[q[0]]===a[0]?'active':''}" onclick="answer('${q[0]}','${a[0]}')">${a[1]}</button>`).join('')}</div></div>`).join('')}</div><div class="card evaluation"><h3>Live-Bewertung</h3>${score()}<div class="status-card"><b>Rechtskonformität</b><div class="progress"><span style="width:71%;background:var(--c)"></span></div></div><div class="status-card"><b>Technischer Zustand</b><div class="progress"><span style="width:88%;background:var(--b)"></span></div></div><div class="status-card"><b>Dokumentation</b><div class="progress"><span style="width:64%;background:var(--c)"></span></div></div></div></div></section>`}
function findings(){return `<section class="page" id="findings"><div class="section-head"><div><h2>Feststellungen</h2><p>Technische Abweichungen, Mängel und Nachweise</p></div><button class="primary">Feststellung erfassen</button></div><div class="card evaluation"><table><tr><th>ID</th><th>Feststellung</th><th>Klassifikation</th><th>Frist</th><th>Status</th></tr>${state.findings.map(f=>`<tr><td><b>${f.id}</b></td><td>${f.title}</td><td>${f.type}</td><td>${f.due}</td><td><span class="pill">${f.status}</span></td></tr>`).join('')}</table></div></section>`}
function measures(){return `<section class="page" id="measures"><div class="section-head"><div><h2>Maßnahmenmanagement</h2><p>Fristen, Nachweise und fachliche Anerkennung</p></div></div><div class="grid three">${state.findings.map((f,i)=>`<div class="card evaluation"><span class="eyebrow">${f.id}</span><h3>${f.title}</h3><p>${f.type} · Frist ${f.due}</p><label>Status<select onchange="measure(${i},this.value)"><option ${f.status==='Offen'?'selected':''}>Offen</option><option ${f.status==='Nachweis hochgeladen'?'selected':''}>Nachweis hochgeladen</option><option ${f.status==='Erledigt'?'selected':''}>Erledigt</option></select></label></div>`).join('')}</div></section>`}
function reports(){const r=Object.values(state.sources).filter(x=>x==='red').length,y=Object.values(state.sources).filter(x=>x==='yellow').length,locked=r+y>0;return `<section class="page" id="reports"><div class="section-head"><div><h2>Bericht und Quality Gate</h2><p>Interne Quellenfarben werden in finalen Berichten entfernt.</p></div><button class="primary ${locked?'locked':''}" onclick="release()">Bericht freigeben</button></div><div class="grid two"><div class="card"><span class="eyebrow">Prüfbericht</span><h2>Brandmeldeanlage BMA-01</h2><p>Objekt: Reinbold GmbH · Standort Spittal an der Drau</p>${score()}<h3>Feststellungen</h3>${state.findings.map(f=>`<div class="status-card"><b>${f.id} · ${f.title}</b><p>${f.type} · Behebung bis ${f.due}</p></div>`).join('')}</div><div class="card evaluation"><h3>Qualitätssicherung</h3><div class="quality"><div class="source-red"><strong>${r}</strong>Ungeprüft</div><div class="source-yellow"><strong>${y}</strong>Vorperiode</div><div class="source-green"><strong>${Object.values(state.sources).filter(x=>x==='green').length}</strong>Verifiziert</div></div><div class="status-card" style="margin-top:15px"><b>${locked?'Freigabe gesperrt':'Freigabefähig'}</b><p>${locked?'Rote und gelbe Inhalte müssen vor Freigabe verifiziert werden.':'Alle prüfrelevanten Inhalte sind verifiziert.'}</p></div><button class="secondary" onclick="verifyAll()">Alle Demoinhalte verifizieren</button></div></div></section>`}
function documents(){return `<section class="page" id="documents"><div class="section-head"><div><h2>SharePoint-Dokumentenakte</h2><p>Objektbezogene Dokumente und Quellenstatus</p></div><button class="primary">Dokument hochladen</button></div><div class="card"><table><tr><th>Dokument</th><th>Typ</th><th>Quelle</th><th>Aktion</th></tr><tr><td>BMA_Prüfbericht_2025.pdf</td><td>Vorbericht</td><td>${source('yellow')}</td><td><button class="link">Öffnen</button></td></tr><tr><td>Bestandsplan_EG.pdf</td><td>Plan</td><td>${source('green')}</td><td><button class="link">Öffnen</button></td></tr><tr><td>Musterbericht_BMA.docx</td><td>Muster</td><td>${source('red')}</td><td><button class="link">Prüfen</button></td></tr></table></div></section>`}
function customer(){return `<section class="page" id="customer"><div class="section-head"><div><h2>Kundenportal</h2><p>Freigegebene externe Sicht</p></div></div><div class="grid hero"><div class="card hero-card"><div><span class="eyebrow">Reinbold GmbH</span><h2>Standort Spittal</h2><p>Nächste Prüfung: 18.05.2027 · Offene Maßnahmen: ${state.findings.filter(f=>f.status!=='Erledigt').length}</p><button class="primary">Unterlagen hochladen</button></div><div>${score()}</div></div><div class="card"><h3>Schnellzugriff</h3><div class="status-card"><button class="link">Berichte und Nachweise</button></div><div class="status-card"><button class="link">Maßnahmenstatus</button></div><div class="status-card"><button class="link">Ansprechpartner und Daten</button></div></div></div></section>`}
function render(){document.getElementById('nav').innerHTML=nav.map(n=>`<button data-page="${n[0]}" onclick="showPage('${n[0]}')"><b>${n[2]}</b><span>${n[1]}</span>${n[0]==='measures'?`<em class="badge">${state.findings.filter(f=>f.status!=='Erledigt').length}</em>`:''}</button>`).join('');document.getElementById('pages').innerHTML=dashboard()+master()+inspection()+findings()+measures()+reports()+documents()+customer();showPage(window.currentPage||'dashboard')}
function showPage(id){window.currentPage=id;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));document.getElementById('pageTitle').textContent=nav.find(n=>n[0]===id)[1];window.scrollTo(0,0)}function answer(id,val){state.answers[id]=val;recalc()}function measure(i,val){state.findings[i].status=val;recalc()}function verifyAll(){Object.keys(state.sources).forEach(k=>state.sources[k]='green');save();render();showPage('reports')}function release(){if(Object.values(state.sources).some(x=>x!=='green'))alert('Freigabe gesperrt: Nicht alle Inhalte sind verifiziert.');else alert('Bericht fachlich freigegeben.')}document.getElementById('syncBtn').onclick=()=>{const x=document.getElementById('syncState');x.textContent='↻ Synchronisierung läuft';setTimeout(()=>x.textContent='● Synchronisiert',900)};render();
</script>
</body>
</html>
